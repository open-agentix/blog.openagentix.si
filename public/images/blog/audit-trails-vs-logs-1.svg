<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Telemetry lane versus audit lane for one agent run</title><desc id="d">One agent run feeds two lanes. Telemetry is sampled, rotated and used for debugging. The audit trail is complete, hash-chained and retained.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b4a6b"/></marker></defs><rect width="480" height="320" rx="12" fill="#f5f7fb"/><rect x="14" y="120" width="90" height="80" rx="8" fill="#dbe7ff" stroke="#3b4a6b" stroke-width="1.5"/><text x="59.0" y="155.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">One</text><text x="59.0" y="173.6" text-anchor="middle" font-size="13" fill="#1b2433">agent run</text><rect x="160" y="24" width="306" height="120" rx="8" fill="#ffe9c7" stroke="#3b4a6b" stroke-width="1.5"/><text x="313.0" y="61.5" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Telemetry lane</text><text x="313.0" y="79.5" text-anchor="middle" font-size="13" fill="#1b2433">sampled, rotated</text><text x="313.0" y="97.5" text-anchor="middle" font-size="13" fill="#1b2433">for debugging</text><text x="313.0" y="115.5" text-anchor="middle" font-size="13" fill="#1b2433">may drop events</text><rect x="160" y="176" width="306" height="120" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="313.0" y="213.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Audit lane</text><text x="313.0" y="231.6" text-anchor="middle" font-size="13" fill="#1b2433">complete, attributable</text><text x="313.0" y="249.6" text-anchor="middle" font-size="13" fill="#1b2433">hash-chained, retained</text><text x="313.0" y="267.6" text-anchor="middle" font-size="13" fill="#1b2433">drops nothing</text><line x1="104" y1="150" x2="160" y2="84" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><line x1="104" y1="170" x2="160" y2="236" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/></svg>
