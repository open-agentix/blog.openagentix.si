<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" fill="currentColor"><title id="t">Review checklist for third-party agent skills</title><desc id="d">A checklist card with seven review items. The safe path is a pinned copy in your own repository; installing from a URL at runtime is crossed out.</desc><defs><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ad9534f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9534f"/></marker><marker id="a3a9d6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a9d6e"/></marker><marker id="a4a8fd8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a8fd8"/></marker></defs><rect x="10" y="10" width="270" height="400" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="145" y="31.9" text-anchor="middle" font-size="14" font-weight="700">Review checklist</text><rect x="26" y="54" width="18" height="18" rx="3" fill="none" stroke="#3a9d6e" stroke-width="2"/><path d="M29 63 l5 5 l9 -10" fill="none" stroke="#3a9d6e" stroke-width="2"/><text x="54" y="67.5" text-anchor="start" font-size="13">Provenance known</text><rect x="26" y="102" width="18" height="18" rx="3" fill="none" stroke="#3a9d6e" stroke-width="2"/><path d="M29 111 l5 5 l9 -10" fill="none" stroke="#3a9d6e" stroke-width="2"/><text x="54" y="115.5" text-anchor="start" font-size="13">Version and commit pinned</text><rect x="26" y="150" width="18" height="18" rx="3" fill="none" stroke="#3a9d6e" stroke-width="2"/><path d="M29 159 l5 5 l9 -10" fill="none" stroke="#3a9d6e" stroke-width="2"/><text x="54" y="163.6" text-anchor="start" font-size="13">Read the whole folder</text><rect x="26" y="198" width="18" height="18" rx="3" fill="none" stroke="#3a9d6e" stroke-width="2"/><path d="M29 207 l5 5 l9 -10" fill="none" stroke="#3a9d6e" stroke-width="2"/><text x="54" y="211.6" text-anchor="start" font-size="13">Scripts reviewed</text><rect x="26" y="246" width="18" height="18" rx="3" fill="none" stroke="#3a9d6e" stroke-width="2"/><path d="M29 255 l5 5 l9 -10" fill="none" stroke="#3a9d6e" stroke-width="2"/><text x="54" y="259.6" text-anchor="start" font-size="13">No runtime fetches</text><rect x="26" y="294" width="18" height="18" rx="3" fill="none" stroke="#3a9d6e" stroke-width="2"/><path d="M29 303 l5 5 l9 -10" fill="none" stroke="#3a9d6e" stroke-width="2"/><text x="54" y="307.6" text-anchor="start" font-size="13">Least privilege tools</text><rect x="26" y="342" width="18" height="18" rx="3" fill="none" stroke="#3a9d6e" stroke-width="2"/><path d="M29 351 l5 5 l9 -10" fill="none" stroke="#3a9d6e" stroke-width="2"/><text x="54" y="355.6" text-anchor="start" font-size="13">Licence checked</text><rect x="300" y="60" width="170" height="100" rx="6" fill="#3a9d6e" fill-opacity="0.10" stroke="#3a9d6e" stroke-width="1.6"/><text x="385.0" y="105.8" text-anchor="middle" font-size="14" font-weight="700">Pinned copy</text><text x="385.0" y="124.0" text-anchor="middle" font-size="14">in own repo</text><rect x="300" y="220" width="170" height="100" rx="6" fill="#d9534f" fill-opacity="0.10" stroke="#d9534f" stroke-width="1.6"/><text x="385.0" y="266.1" text-anchor="middle" font-size="13">Install from URL</text><text x="385.0" y="283.0" text-anchor="middle" font-size="13">at runtime</text><line x1="300" y1="320" x2="470" y2="220" stroke="#d9534f" stroke-width="3"/></svg>
