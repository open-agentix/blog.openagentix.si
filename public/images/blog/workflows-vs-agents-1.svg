<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="t d"><title id="t">Scale of autonomy from workflow to agent</title><desc id="d">A horizontal scale from fixed workflow to open agent loop with four example steps placed along it: extracting fields, routing by label, drafting a reply and fixing a failing build.</desc><style>text{fill:currentColor;font:14px sans-serif}.h{font-weight:600}.b{fill:none;stroke:currentColor;stroke-width:1.5;stroke-opacity:.75}.f{fill:currentColor;fill-opacity:.07}.a{stroke:var(--accent,#6d28d9);stroke-opacity:1;stroke-width:2}.at{fill:var(--accent,#6d28d9)}.r{stroke:var(--danger,#be123c);stroke-width:2}.rt{fill:var(--danger,#be123c)}.d{stroke-dasharray:6 4}.l{stroke:currentColor;stroke-width:1.5;stroke-opacity:.75;fill:none}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><line x1="30" y1="60" x2="450" y2="60" class="l" marker-end="url(#m)"/><text x="30" y="40" text-anchor="start" class="h">Fixed workflow</text><text x="450" y="40" text-anchor="end" class="h at">Open agent loop</text><circle cx="60" cy="60" r="6" class="b f a"/><text x="60" y="100" text-anchor="middle" class="h">Extract fields</text><text x="60" y="120" text-anchor="middle" class="">code path</text><circle cx="165" cy="60" r="6" class="b f a"/><text x="165" y="100" text-anchor="middle" class="h">Route by label</text><text x="165" y="120" text-anchor="middle" class="">code + 1 model call</text><circle cx="285" cy="60" r="6" class="b f a"/><text x="285" y="100" text-anchor="middle" class="h">Draft a reply</text><text x="285" y="120" text-anchor="middle" class="">model chooses steps</text><circle cx="405" cy="60" r="6" class="b f a"/><text x="405" y="100" text-anchor="middle" class="h">Fix a failing build</text><text x="405" y="120" text-anchor="middle" class="">loop with tools</text><text x="30" y="200" text-anchor="start" class="">Left: cheaper, testable, easy to govern.</text><text x="30" y="225" text-anchor="start" class="">Right: flexible, costlier, harder to predict.</text><text x="30" y="260" text-anchor="start" class="h at">Pick the least autonomy that solves the step.</text></svg>
