<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 340" role="img" aria-labelledby="t d"><title id="t">OAuth flow for a remote MCP server with audience validation</title><desc id="d">The MCP client requests a token from the authorization server for a specific resource. The MCP server validates that the audience of the token is itself and rejects tokens issued for other servers.</desc><style>text{fill:currentColor;font:14px sans-serif}.h{font-weight:600}.b{fill:none;stroke:currentColor;stroke-width:1.5;stroke-opacity:.75}.f{fill:currentColor;fill-opacity:.07}.a{stroke:var(--accent,#6d28d9);stroke-opacity:1;stroke-width:2}.at{fill:var(--accent,#6d28d9)}.r{stroke:var(--danger,#be123c);stroke-width:2}.rt{fill:var(--danger,#be123c)}.d{stroke-dasharray:6 4}.l{stroke:currentColor;stroke-width:1.5;stroke-opacity:.75;fill:none}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><rect x="10" y="10" width="115" height="36" rx="6" class="b f"/><text x="67.5" y="33.0" text-anchor="middle" class="h">MCP client</text><line x1="67" y1="46" x2="67" y2="330" class="l d"/><rect x="185" y="10" width="115" height="36" rx="6" class="b f"/><text x="242.5" y="33.0" text-anchor="middle" class="h">Auth server</text><line x1="242" y1="46" x2="242" y2="330" class="l d"/><rect x="355" y="10" width="115" height="36" rx="6" class="b f"/><text x="412.5" y="33.0" text-anchor="middle" class="h">MCP server</text><line x1="412" y1="46" x2="412" y2="330" class="l d"/><line x1="67" y1="80" x2="242" y2="80" class="l" marker-end="url(#m)"/><text x="70" y="72" text-anchor="start" class="">1 authorize + resource=server</text><line x1="242" y1="112" x2="67" y2="112" class="l" marker-end="url(#m)"/><text x="70" y="104" text-anchor="start" class="">2 token, aud = server</text><line x1="67" y1="160" x2="412" y2="160" class="l a" marker-end="url(#m)"/><text x="70" y="152" text-anchor="start" class="at">3 request + Bearer token</text><rect x="330" y="175" width="150" height="56" rx="6" class="b f a"/><text x="405.0" y="200.0" text-anchor="middle" class="h at">validate audience</text><text x="405.0" y="218.0" text-anchor="middle" class="at">reject other tokens</text><line x1="412" y1="245" x2="67" y2="245" class="l" marker-end="url(#m)"/><text x="70" y="237" text-anchor="start" class="">4 200 OK, or 401 + metadata</text><line x1="67" y1="290" x2="412" y2="290" class="l r" marker-end="url(#m)"/><text x="70" y="282" text-anchor="start" class="rt">token meant for another server</text><text x="412" y="315" text-anchor="middle" class="rt">rejected</text></svg>
