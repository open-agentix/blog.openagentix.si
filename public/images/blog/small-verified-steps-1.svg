<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" fill="currentColor"><title id="t">Loop of small steps each followed by a verification check</title><desc id="d">Plan, one change, check, note, next. When a check fails the loop exits to a clean state.</desc><defs><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ad9534f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9534f"/></marker><marker id="a3a9d6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a9d6e"/></marker><marker id="a4a8fd8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a8fd8"/></marker></defs><rect x="60" y="10" width="220" height="44" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="170.0" y="36.9" text-anchor="middle" font-size="14">1. Plan the next step</text><line x1="170" y1="54" x2="170" y2="72" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="60" y="72" width="220" height="44" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="170.0" y="98.9" text-anchor="middle" font-size="14">2. Make one change</text><line x1="170" y1="116" x2="170" y2="134" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="60" y="134" width="220" height="44" rx="6" fill="#4a8fd8" fill-opacity="0.10" stroke="#4a8fd8" stroke-width="1.6"/><text x="170.0" y="160.9" text-anchor="middle" font-size="14" font-weight="700">3. Run acceptance check</text><line x1="170" y1="178" x2="170" y2="196" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="60" y="196" width="220" height="44" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="170.0" y="222.9" text-anchor="middle" font-size="14">4. Write a progress note</text><line x1="170" y1="240" x2="170" y2="258" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="60" y="258" width="220" height="44" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="170.0" y="284.9" text-anchor="middle" font-size="14">5. Clean state, next step</text><line x1="280" y1="156" x2="400" y2="156" stroke="#d9534f" stroke-width="1.8" marker-end="url(#ad9534f)"/><rect x="400" y="134" width="70" height="44" rx="6" fill="#d9534f" fill-opacity="0.10" stroke="#d9534f" stroke-width="1.6"/><text x="435.0" y="152.4" text-anchor="middle" font-size="12">Fail:</text><text x="435.0" y="168.0" text-anchor="middle" font-size="12">revert</text><path d="M60 280 H30 V32 H60" fill="none" stroke="currentColor" stroke-width="1.8" marker-end="url(#acurrentColor)"/><text x="170" y="322.6" text-anchor="middle" font-size="13" fill="#3a9d6e">Pass: next step</text></svg>
