<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="t d"><title id="t">Example SLO board for an agent service</title><desc id="d">A board with four service level indicators for an agent service: task success rate, pass^k consistency, p95 latency and cost per task, plus a line showing the error budget being used up over the window.</desc><style>text{fill:currentColor;font:14px sans-serif}.h{font-weight:600}.b{fill:none;stroke:currentColor;stroke-width:1.5;stroke-opacity:.75}.f{fill:currentColor;fill-opacity:.07}.a{stroke:var(--accent,#6d28d9);stroke-opacity:1;stroke-width:2}.at{fill:var(--accent,#6d28d9)}.r{stroke:var(--danger,#be123c);stroke-width:2}.rt{fill:var(--danger,#be123c)}.d{stroke-dasharray:6 4}.l{stroke:currentColor;stroke-width:1.5;stroke-opacity:.75;fill:none}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><rect x="10" y="10" width="225" height="74" rx="6" class="b f"/><text x="122.5" y="44.0" text-anchor="middle" class="h h">Task success</text><text x="122.5" y="62.0" text-anchor="middle" class="h">&#8805; 90 %  (28-day window)</text><rect x="245" y="10" width="225" height="74" rx="6" class="b f"/><text x="357.5" y="44.0" text-anchor="middle" class="h h">pass^k (k=5)</text><text x="357.5" y="62.0" text-anchor="middle" class="h">&#8805; 70 %  (consistency)</text><rect x="10" y="94" width="225" height="74" rx="6" class="b f"/><text x="122.5" y="128.0" text-anchor="middle" class="h h">p95 latency</text><text x="122.5" y="146.0" text-anchor="middle" class="h">&#8804; 120 s  (per task)</text><rect x="245" y="94" width="225" height="74" rx="6" class="b f"/><text x="357.5" y="128.0" text-anchor="middle" class="h h">Cost per task</text><text x="357.5" y="146.0" text-anchor="middle" class="h">&#8804; 0.40 USD  (p90)</text><text x="10" y="208" text-anchor="start" class="h">Error budget burn (task success)</text><line x1="10" y1="225" x2="470" y2="225" class="l"/><line x1="10" y1="225" x2="10" y2="290" class="l"/><line x1="10" y1="290" x2="470" y2="290" class="l d"/><polyline points="10,230 120,238 230,252 330,262 400,278 470,286" fill="none" class="a"/><text x="14" y="246" text-anchor="start" class="">100 % budget</text><text x="470" y="282" text-anchor="end" class="">0 %</text><text x="240" y="318" text-anchor="middle" class="">Budget nearly spent: freeze rollouts, fix reliability first.</text></svg>
