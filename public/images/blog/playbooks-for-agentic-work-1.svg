<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d"><title id="t">A playbook as fixed steps with typed handovers, a judgement step, a check and a stop rule</title><desc id="d">A trigger starts a deterministic fetch step, which hands a typed result to a model judgement step with a schema. A condition decides whether a write step with approval runs. A check closes the run; a stop rule escalates to a person.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="300" rx="8" fill="#ffffff"/>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<g font-family="system-ui,sans-serif" font-size="13" stroke="currentColor" stroke-width="2" fill="none">
<rect x="10" y="20" width="100" height="56" rx="8"/><text fill="currentColor" stroke="none" x="60" y="44" text-anchor="middle" font-weight="700">Trigger</text><text fill="currentColor" stroke="none" x="60" y="62" text-anchor="middle" font-size="12">cron, event</text>
<line x1="110" y1="48" x2="134" y2="48" marker-end="url(#m)"/>
<rect x="136" y="20" width="100" height="56" rx="8"/><text fill="currentColor" stroke="none" x="186" y="44" text-anchor="middle" font-weight="700">Fetch</text><text fill="currentColor" stroke="none" x="186" y="62" text-anchor="middle" font-size="12">code, read-only</text>
<line x1="236" y1="48" x2="260" y2="48" marker-end="url(#m)"/>
<rect x="262" y="20" width="100" height="56" rx="8" stroke="#6d28d9"/><text fill="#6d28d9" stroke="none" x="312" y="44" text-anchor="middle" font-weight="700">Judge</text><text fill="#6d28d9" stroke="none" x="312" y="62" text-anchor="middle" font-size="12">model + schema</text>
<line x1="362" y1="48" x2="386" y2="48" marker-end="url(#m)"/>
<rect x="388" y="20" width="82" height="56" rx="8"/><text fill="currentColor" stroke="none" x="429" y="44" text-anchor="middle" font-weight="700">when?</text><text fill="currentColor" stroke="none" x="429" y="62" text-anchor="middle" font-size="12">condition</text>
<line x1="429" y1="76" x2="429" y2="120" marker-end="url(#m)"/>
<rect x="340" y="122" width="130" height="56" rx="8"/><text fill="currentColor" stroke="none" x="405" y="146" text-anchor="middle" font-weight="700">Act</text><text fill="currentColor" stroke="none" x="405" y="164" text-anchor="middle" font-size="12">write + approval</text>
<line x1="340" y1="150" x2="250" y2="150" marker-end="url(#m)"/>
<rect x="130" y="122" width="118" height="56" rx="8"/><text fill="currentColor" stroke="none" x="189" y="146" text-anchor="middle" font-weight="700">Check</text><text fill="currentColor" stroke="none" x="189" y="164" text-anchor="middle" font-size="12">tests, probe</text>
<line x1="130" y1="150" x2="70" y2="150"/><line x1="70" y1="150" x2="70" y2="198" marker-end="url(#m)"/>
<rect x="10" y="200" width="120" height="44" rx="8"/><text fill="currentColor" stroke="none" x="70" y="227" text-anchor="middle">Done + evidence</text>
<line x1="312" y1="76" x2="312" y2="198" stroke-dasharray="6 4" stroke="#be123c" marker-end="url(#m)"/>
<rect x="240" y="200" width="144" height="44" rx="8" stroke="#be123c"/><text fill="#be123c" stroke="none" x="312" y="227" text-anchor="middle">Stop: escalate</text>
<text fill="currentColor" stroke="none" x="10" y="280" font-size="12">Budget for the whole run: steps, tool calls, tokens, time.</text>
</g></svg>
