<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d"><title id="t">Drift detection loop with golden runs, run metrics, canary and rollback</title><desc id="d">Changes to model, prompt, tools or inputs feed two detectors: golden runs re-run on every change and on a schedule, and production run metrics compared to a baseline. Both feed a canary decision that promotes the new version or rolls back to the pinned previous one.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="320" rx="8" fill="#ffffff"/>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<g font-family="system-ui,sans-serif" font-size="13" stroke="currentColor" stroke-width="2" fill="none">
<rect x="140" y="10" width="200" height="50" rx="8"/><text fill="currentColor" stroke="none" x="240" y="31" text-anchor="middle" font-weight="700">Change</text><text fill="currentColor" stroke="none" x="240" y="49" text-anchor="middle" font-size="12">model, prompt, tool, input</text>
<line x1="200" y1="60" x2="110" y2="94" marker-end="url(#m)"/><line x1="280" y1="60" x2="370" y2="94" marker-end="url(#m)"/>
<rect x="20" y="96" width="180" height="60" rx="8" stroke="#6d28d9"/><text fill="#6d28d9" stroke="none" x="110" y="120" text-anchor="middle" font-weight="700">Golden runs</text><text fill="#6d28d9" stroke="none" x="110" y="139" text-anchor="middle" font-size="12">known cases, k trials</text>
<rect x="280" y="96" width="180" height="60" rx="8" stroke="#6d28d9"/><text fill="#6d28d9" stroke="none" x="370" y="120" text-anchor="middle" font-weight="700">Run metrics</text><text fill="#6d28d9" stroke="none" x="370" y="139" text-anchor="middle" font-size="12">cost, steps, errors</text>
<line x1="110" y1="156" x2="200" y2="190" marker-end="url(#m)"/><line x1="370" y1="156" x2="280" y2="190" marker-end="url(#m)"/>
<rect x="140" y="192" width="200" height="50" rx="8"/><text fill="currentColor" stroke="none" x="240" y="213" text-anchor="middle" font-weight="700">Canary decision</text><text fill="currentColor" stroke="none" x="240" y="231" text-anchor="middle" font-size="12">compare to baseline</text>
<line x1="190" y1="242" x2="110" y2="264" marker-end="url(#m)"/><line x1="290" y1="242" x2="370" y2="264" marker-end="url(#m)"/>
<rect x="30" y="266" width="160" height="40" rx="8"/><text fill="currentColor" stroke="none" x="110" y="291" text-anchor="middle">Promote</text>
<rect x="290" y="266" width="160" height="40" rx="8" stroke="#be123c"/><text fill="#be123c" stroke="none" x="370" y="291" text-anchor="middle">Roll back to pinned</text>
</g></svg>
