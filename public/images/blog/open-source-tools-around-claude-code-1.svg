<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t d"><title id="t">Five tools placed on the layers of an agent stack</title><desc id="d">Five horizontal layers from top to bottom: platform with openagentix, interface with Open WebUI, harness with Claude Code and OpenCode, model access with OpenRouter, model runtime with Ollama. Only OpenCode sits in the same layer as Claude Code.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="360" rx="8" fill="#ffffff"/>
<g font-family="system-ui,sans-serif" font-size="14" stroke="currentColor" stroke-width="2" fill="none">
<rect x="10" y="14" width="460" height="56" rx="8"/><text fill="currentColor" stroke="none" x="24" y="38" font-weight="700">Platform</text><text fill="currentColor" stroke="none" x="24" y="58" font-size="12">events, policy, audit, budgets</text><rect x="250" y="24" width="200" height="36" rx="6" stroke="#6d28d9"/><text fill="#6d28d9" stroke="none" x="350" y="47" text-anchor="middle">openagentix</text>
<rect x="10" y="80" width="460" height="56" rx="8"/><text fill="currentColor" stroke="none" x="24" y="104" font-weight="700">Interface</text><text fill="currentColor" stroke="none" x="24" y="124" font-size="12">where people read and type</text><rect x="250" y="90" width="200" height="36" rx="6"/><text fill="currentColor" stroke="none" x="350" y="113" text-anchor="middle">Open WebUI (chat)</text>
<rect x="10" y="146" width="460" height="66" rx="8"/><text fill="currentColor" stroke="none" x="24" y="170" font-weight="700">Harness</text><text fill="currentColor" stroke="none" x="24" y="190" font-size="12">agent loop, tools, permissions</text><rect x="212" y="158" width="116" height="40" rx="6" stroke-dasharray="6 4"/><text fill="currentColor" stroke="none" x="270" y="183" text-anchor="middle">Claude Code</text><rect x="336" y="158" width="114" height="40" rx="6"/><text fill="currentColor" stroke="none" x="393" y="183" text-anchor="middle">OpenCode</text>
<rect x="10" y="222" width="460" height="56" rx="8"/><text fill="currentColor" stroke="none" x="24" y="246" font-weight="700">Model access</text><text fill="currentColor" stroke="none" x="24" y="266" font-size="12">keys, providers, routing</text><rect x="250" y="232" width="200" height="36" rx="6"/><text fill="currentColor" stroke="none" x="350" y="255" text-anchor="middle">OpenRouter (hosted)</text>
<rect x="10" y="288" width="460" height="56" rx="8"/><text fill="currentColor" stroke="none" x="24" y="312" font-weight="700">Model runtime</text><text fill="currentColor" stroke="none" x="24" y="332" font-size="12">where inference runs</text><rect x="250" y="298" width="200" height="36" rx="6"/><text fill="currentColor" stroke="none" x="350" y="321" text-anchor="middle">Ollama (local)</text>
</g></svg>
