<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Map from OWASP agentic risks to platform controls</title><desc id="d">Two columns: risk categories on the left, the platform control that answers each on the right, such as sandboxing, least privilege, injection patterns, human approval.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b4a6b"/></marker></defs><rect width="480" height="330" rx="12" fill="#f5f7fb"/><text x="125" y="22" text-anchor="middle" font-size="14" fill="#1b2433" font-weight="700">Risk</text><text x="365" y="22" text-anchor="middle" font-size="14" fill="#1b2433" font-weight="700">Platform control</text><rect x="14" y="34" width="222" height="40" rx="8" fill="#fbdcdc" stroke="#3b4a6b" stroke-width="1.5"/><text x="125.0" y="58.5" text-anchor="middle" font-size="13" fill="#1b2433">Goal hijack, injection</text><rect x="268" y="34" width="198" height="40" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="367.0" y="58.5" text-anchor="middle" font-size="13" fill="#1b2433">injection patterns</text><line x1="236" y1="54" x2="268" y2="54" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><rect x="14" y="83" width="222" height="40" rx="8" fill="#fbdcdc" stroke="#3b4a6b" stroke-width="1.5"/><text x="125.0" y="107.5" text-anchor="middle" font-size="13" fill="#1b2433">Excess agency</text><rect x="268" y="83" width="198" height="40" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="367.0" y="107.5" text-anchor="middle" font-size="13" fill="#1b2433">least privilege</text><line x1="236" y1="103" x2="268" y2="103" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><rect x="14" y="132" width="222" height="40" rx="8" fill="#fbdcdc" stroke="#3b4a6b" stroke-width="1.5"/><text x="125.0" y="156.6" text-anchor="middle" font-size="13" fill="#1b2433">Tool misuse</text><rect x="268" y="132" width="198" height="40" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="367.0" y="156.6" text-anchor="middle" font-size="13" fill="#1b2433">argument constraints</text><line x1="236" y1="152" x2="268" y2="152" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><rect x="14" y="181" width="222" height="40" rx="8" fill="#fbdcdc" stroke="#3b4a6b" stroke-width="1.5"/><text x="125.0" y="205.6" text-anchor="middle" font-size="13" fill="#1b2433">Code execution</text><rect x="268" y="181" width="198" height="40" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="367.0" y="205.6" text-anchor="middle" font-size="13" fill="#1b2433">sandbox</text><line x1="236" y1="201" x2="268" y2="201" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><rect x="14" y="230" width="222" height="40" rx="8" fill="#fbdcdc" stroke="#3b4a6b" stroke-width="1.5"/><text x="125.0" y="254.6" text-anchor="middle" font-size="13" fill="#1b2433">Privileged actions</text><rect x="268" y="230" width="198" height="40" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="367.0" y="254.6" text-anchor="middle" font-size="13" fill="#1b2433">human approval</text><line x1="236" y1="250" x2="268" y2="250" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><rect x="14" y="279" width="222" height="40" rx="8" fill="#fbdcdc" stroke="#3b4a6b" stroke-width="1.5"/><text x="125.0" y="303.6" text-anchor="middle" font-size="13" fill="#1b2433">Untraceable runs</text><rect x="268" y="279" width="198" height="40" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="367.0" y="303.6" text-anchor="middle" font-size="13" fill="#1b2433">audit trail</text><line x1="236" y1="299" x2="268" y2="299" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/></svg>
