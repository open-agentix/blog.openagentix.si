<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif" fill="currentColor">
<title id="t">MCP sampling, elicitation and tasks with their control points</title>
<desc id="d">Three requests go from the MCP server to the client. Sampling asks for a model call, elicitation asks the user for input, tasks report long-running work. Each has a control point on the client side.</desc>
<rect x="10" y="10" width="140" height="40" rx="8" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-opacity="0.55"/>
<text x="22" y="35.0" font-size="15" font-weight="700">MCP server</text>
<rect x="330" y="10" width="140" height="40" rx="8" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-opacity="0.55"/>
<text x="342" y="35.0" font-size="15" font-weight="700">Client + user</text>
<text x="12" y="70" font-size="15" font-weight="700">sampling</text><text x="12" y="87" font-size="13" fill-opacity="0.8">model call</text>
<line x1="170" y1="76" x2="320" y2="76" stroke="currentColor" stroke-width="2"/>
<polygon points="320,76 312,71 312,81" />
<rect x="200" y="86" width="270" height="26" rx="13" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><text x="212" y="104" font-size="13">control point: client approves, picks model</text>
<text x="12" y="148" font-size="15" font-weight="700">elicitation</text><text x="12" y="165" font-size="13" fill-opacity="0.8">user input</text>
<line x1="170" y1="154" x2="320" y2="154" stroke="currentColor" stroke-width="2"/>
<polygon points="320,154 312,149 312,159" />
<rect x="200" y="164" width="270" height="26" rx="13" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><text x="212" y="182" font-size="13">control point: user can decline, no secrets</text>
<text x="12" y="226" font-size="15" font-weight="700">tasks</text><text x="12" y="243" font-size="13" fill-opacity="0.8">long-running status</text>
<line x1="170" y1="232" x2="320" y2="232" stroke="currentColor" stroke-width="2"/>
<polygon points="320,232 312,227 312,237" />
<rect x="200" y="242" width="270" height="26" rx="13" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><text x="212" y="260" font-size="13">control point: client polls, can cancel</text>
</svg>
