<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Prompt hygiene checklist</title><desc id="d">Checklist card: owner, version, eval, scope and last review for every prompt, plus an arrow showing that repeated text moves into a skill.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b4a6b"/></marker></defs><rect width="480" height="320" rx="12" fill="#f5f7fb"/><rect x="14" y="14" width="260" height="292" rx="8" fill="#ffffff" stroke="#3b4a6b" stroke-width="1.5"/><text x="144" y="44" text-anchor="middle" font-size="14" fill="#1b2433" font-weight="700">Every prompt has</text><text x="34" y="92" text-anchor="start" font-size="15" fill="#1b2433" font-family="ui-monospace,Menlo,Consolas,monospace">[x] owner</text><text x="34" y="132" text-anchor="start" font-size="15" fill="#1b2433" font-family="ui-monospace,Menlo,Consolas,monospace">[x] version</text><text x="34" y="172" text-anchor="start" font-size="15" fill="#1b2433" font-family="ui-monospace,Menlo,Consolas,monospace">[x] eval</text><text x="34" y="212" text-anchor="start" font-size="15" fill="#1b2433" font-family="ui-monospace,Menlo,Consolas,monospace">[x] scope</text><text x="34" y="252" text-anchor="start" font-size="15" fill="#1b2433" font-family="ui-monospace,Menlo,Consolas,monospace">[x] last review date</text><rect x="320" y="60" width="146" height="70" rx="8" fill="#fbdcdc" stroke="#3b4a6b" stroke-width="1.5"/><text x="393.0" y="90.5" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Same text</text><text x="393.0" y="108.5" text-anchor="middle" font-size="13" fill="#1b2433">in 3 places?</text><rect x="320" y="200" width="146" height="70" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="393.0" y="230.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Move it</text><text x="393.0" y="248.6" text-anchor="middle" font-size="13" fill="#1b2433">into a skill</text><line x1="393" y1="130" x2="393" y2="200" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/></svg>
