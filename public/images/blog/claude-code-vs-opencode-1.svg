<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 346" role="img" aria-labelledby="t d"><title id="t">Feature matrix of two coding agent harnesses for governance controls</title><desc id="d">Rows list governance controls: permission model, subagents, MCP support, provider choice, telemetry export, managed settings. Columns are Claude Code and OpenCode with the point to verify for each. Cells say what to check in the documentation rather than scoring the tools.</desc>
<g font-family="system-ui,sans-serif" stroke="currentColor" stroke-width="1.5" fill="none" font-size="13">
<rect x="10" y="10" width="460" height="310" rx="8"/>
<line x1="150" y1="10" x2="150" y2="320"/><line x1="315" y1="10" x2="315" y2="320"/>
<line x1="10" y1="44" x2="470" y2="44"/>
<line x1="10" y1="96" x2="470" y2="96"/><line x1="10" y1="148" x2="470" y2="148"/><line x1="10" y1="200" x2="470" y2="200"/><line x1="10" y1="252" x2="470" y2="252"/>
<g stroke="none"><text fill="currentColor" x="232" y="32" text-anchor="middle" font-weight="700">Claude Code</text><text fill="currentColor" x="392" y="32" text-anchor="middle" font-weight="700">OpenCode</text>
<text fill="currentColor" x="20" y="75" font-weight="700">Permissions</text><text fill="currentColor" x="160" y="70">allow / ask / deny</text><text fill="currentColor" x="160" y="88" opacity=".75">rules, modes</text><text fill="currentColor" x="325" y="70">allow / ask / deny</text><text fill="currentColor" x="325" y="88" opacity=".75">per tool, auto mode</text>
<text fill="currentColor" x="20" y="127" font-weight="700">Subagents</text><text fill="currentColor" x="160" y="122">own context,</text><text fill="currentColor" x="160" y="140" opacity=".75">own tool access</text><text fill="currentColor" x="325" y="122">primary agents</text><text fill="currentColor" x="325" y="140" opacity=".75">and subagents</text>
<text fill="currentColor" x="20" y="179" font-weight="700">MCP</text><text fill="currentColor" x="160" y="179">supported</text><text fill="currentColor" x="325" y="179">supported</text>
<text fill="currentColor" x="20" y="231" font-weight="700">Providers</text><text fill="currentColor" x="160" y="226">Anthropic models,</text><text fill="currentColor" x="160" y="244" opacity=".75">cloud routes</text><text fill="currentColor" x="325" y="226">many providers</text><text fill="currentColor" x="325" y="244" opacity=".75">configurable</text>
<text fill="currentColor" x="20" y="283" font-weight="700">Managed config</text><text fill="currentColor" x="160" y="283">verify in docs</text><text fill="currentColor" x="325" y="283">verify in docs</text>
<text fill="currentColor" x="240" y="338" text-anchor="middle" opacity=".75" font-size="13">Check current docs; both change quickly</text></g></g></svg>
