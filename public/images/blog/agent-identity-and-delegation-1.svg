<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14" fill="currentColor">
<title id="t">Token delegation chain from user to agent to tool server</title>
<desc id="d">A sequence from user to platform to agent to tool server. A token is exchanged at each hop, and the acting-for claim is preserved.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="270" rx="8" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<rect x="5" y="8" width="100" height="30" rx="6" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
<text x="55" y="28" text-anchor="middle" font-weight="700">User</text>
<line x1="55" y1="38" x2="55" y2="236" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" opacity=".5"/>
<rect x="120" y="8" width="100" height="30" rx="6" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
<text x="170" y="28" text-anchor="middle" font-weight="700">Platform</text>
<line x1="170" y1="38" x2="170" y2="236" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" opacity=".5"/>
<rect x="250" y="8" width="100" height="30" rx="6" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
<text x="300" y="28" text-anchor="middle" font-weight="700">Agent</text>
<line x1="300" y1="38" x2="300" y2="236" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" opacity=".5"/>
<rect x="375" y="8" width="100" height="30" rx="6" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
<text x="425" y="28" text-anchor="middle" font-weight="700">Tool server</text>
<line x1="425" y1="38" x2="425" y2="236" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3" opacity=".5"/>
<line x1="55" y1="70" x2="170" y2="70" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<text x="112.5" y="64" text-anchor="middle" font-size="13">sign in</text>
<line x1="170" y1="120" x2="300" y2="120" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<text x="235.0" y="114" text-anchor="middle" font-size="13">token: sub = user</text>
<line x1="300" y1="170" x2="425" y2="170" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<text x="362.5" y="164" text-anchor="middle" font-size="13">token: aud = server</text>
<line x1="425" y1="215" x2="300" y2="215" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<text x="362.5" y="209" text-anchor="middle" font-size="13">result</text>
<text x="240" y="258" text-anchor="middle" font-size="13">Acting-for claim (act = agent) survives each exchange</text>
</svg>
