<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d"><title id="t">Plan-then-execute pattern isolating untrusted data from control flow</title><desc id="d">A trusted user query is turned into a fixed plan. An executor runs the plan with tools. Untrusted tool data flows into variables but cannot add or change steps in the plan.</desc><style>text{fill:currentColor;font:14px sans-serif}.h{font-weight:600}.b{fill:none;stroke:currentColor;stroke-width:1.5;stroke-opacity:.75}.f{fill:currentColor;fill-opacity:.07}.a{stroke:var(--accent,#6d28d9);stroke-opacity:1;stroke-width:2}.at{fill:var(--accent,#6d28d9)}.r{stroke:var(--danger,#be123c);stroke-width:2}.rt{fill:var(--danger,#be123c)}.d{stroke-dasharray:6 4}.l{stroke:currentColor;stroke-width:1.5;stroke-opacity:.75;fill:none}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><rect x="10" y="20" width="130" height="60" rx="6" class="b f a"/><text x="75.0" y="47.0" text-anchor="middle" class="h at">Trusted query</text><text x="75.0" y="65.0" text-anchor="middle" class="at">from the user</text><rect x="180" y="20" width="130" height="60" rx="6" class="b f"/><text x="245.0" y="47.0" text-anchor="middle" class="h ">Planner</text><text x="245.0" y="65.0" text-anchor="middle" class="">fixed plan</text><line x1="140" y1="50" x2="178" y2="50" class="l" marker-end="url(#m)"/><rect x="350" y="20" width="120" height="60" rx="6" class="b f a"/><text x="410.0" y="47.0" text-anchor="middle" class="h at">Plan</text><text x="410.0" y="65.0" text-anchor="middle" class="at">step 1, 2, 3</text><line x1="310" y1="50" x2="348" y2="50" class="l" marker-end="url(#m)"/><line x1="410" y1="80" x2="410" y2="130" class="l" marker-end="url(#m)"/><rect x="350" y="132" width="120" height="60" rx="6" class="b f"/><text x="410.0" y="159.0" text-anchor="middle" class="h ">Executor</text><text x="410.0" y="177.0" text-anchor="middle" class="">runs the steps</text><rect x="10" y="132" width="130" height="60" rx="6" class="b f"/><text x="75.0" y="167.0" text-anchor="middle" class="">Tools</text><line x1="348" y1="162" x2="142" y2="162" class="l" marker-end="url(#m)"/><rect x="10" y="232" width="130" height="50" rx="6" class="b f r"/><text x="75.0" y="254.0" text-anchor="middle" class="h rt">Untrusted data</text><text x="75.0" y="272.0" text-anchor="middle" class="rt">web, mail, files</text><line x1="75" y1="232" x2="75" y2="194" class="l r" marker-end="url(#m)"/><text x="150" y="222" text-anchor="start" class="">result flows into variables</text><text x="150" y="242" text-anchor="start" class="rt">it cannot add or change steps</text><line x1="5" y1="205" x2="475" y2="205" class="l d"/><text x="240" y="305" text-anchor="middle" class="">Dashed line: trust boundary. Data crosses it, instructions do not.</text></svg>
