<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 284" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14" fill="currentColor">
<title id="t">Model Context Protocol architecture</title>
<desc id="d">A host application contains MCP clients. Each client talks JSON-RPC to one MCP server. Servers expose tools, resources and prompts.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<rect x="10" y="10" width="180" height="200" rx="8" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5"/>
<text x="100" y="34" text-anchor="middle" font-weight="700">Host (the agent app)</text>
<rect x="30" y="50" width="140" height="50" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/>
<text x="100" y="80" text-anchor="middle">MCP client 1</text>
<rect x="30" y="120" width="140" height="50" rx="6" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/>
<text x="100" y="150" text-anchor="middle">MCP client 2</text>
<rect x="300" y="50" width="170" height="50" rx="6" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
<text x="385" y="80" text-anchor="middle">MCP server A</text>
<line x1="170" y1="75" x2="300" y2="75" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="235" y="68" text-anchor="middle" font-size="13">JSON-RPC</text>
<rect x="300" y="120" width="170" height="50" rx="6" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
<text x="385" y="150" text-anchor="middle">MCP server B</text>
<line x1="170" y1="145" x2="300" y2="145" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="235" y="138" text-anchor="middle" font-size="13">JSON-RPC</text>
<rect x="210" y="226" width="260" height="44" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1"/>
<text x="340" y="246" text-anchor="middle" font-size="13">Servers expose three primitives:</text>
<text x="340" y="264" text-anchor="middle" font-weight="700" font-size="14">tools · resources · prompts</text>
<line x1="385" y1="190" x2="385" y2="226" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
