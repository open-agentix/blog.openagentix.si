<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Air-gapped deployment with a reviewed import path</title><desc id="d">An import station outside the air gap checks signatures and hashes. Only reviewed artefacts cross the gap to the platform, models and skills inside.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b4a6b"/></marker></defs><rect width="480" height="300" rx="12" fill="#f5f7fb"/><rect x="14" y="30" width="170" height="240" rx="8" fill="#ffffff" stroke="#3b4a6b" stroke-width="1.5"/><text x="99" y="58" text-anchor="middle" font-size="14" fill="#1b2433" font-weight="700">Outside</text><text x="99" y="84" text-anchor="middle" font-size="13" fill="#1b2433">models, skills,</text><text x="99" y="104" text-anchor="middle" font-size="13" fill="#1b2433">price lists, updates</text><rect x="36" y="160" width="126" height="76" rx="8" fill="#ffe9c7" stroke="#3b4a6b" stroke-width="1.5"/><text x="99.0" y="185.2" text-anchor="middle" font-size="12" fill="#1b2433" font-weight="700">Import station</text><text x="99.0" y="202.2" text-anchor="middle" font-size="12" fill="#1b2433">signature + hash</text><text x="99.0" y="219.2" text-anchor="middle" font-size="12" fill="#1b2433">review</text><line x1="214" y1="10" x2="214" y2="290" stroke="#3b4a6b" stroke-width="2" stroke-dasharray="6 4"/><text x="214" y="24" text-anchor="middle" font-size="12" fill="#1b2433">air gap</text><rect x="246" y="30" width="220" height="240" rx="8" fill="#ffffff" stroke="#3b4a6b" stroke-width="1.5"/><text x="356" y="58" text-anchor="middle" font-size="14" fill="#1b2433" font-weight="700">Inside</text><text x="356" y="80" text-anchor="middle" font-size="13" fill="#1b2433">no runtime downloads</text><rect x="262" y="100" width="188" height="44" rx="8" fill="#dbe7ff" stroke="#3b4a6b" stroke-width="1.5"/><text x="356.0" y="126.5" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Platform</text><rect x="262" y="160" width="88" height="44" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="306.0" y="186.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Models</text><rect x="362" y="160" width="88" height="44" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="406.0" y="186.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Skills</text><rect x="262" y="216" width="188" height="38" rx="8" fill="#ffffff" stroke="#3b4a6b" stroke-width="1.5"/><text x="356.0" y="239.2" text-anchor="middle" font-size="12" fill="#1b2433">Pinned, versioned</text><line x1="162" y1="198" x2="262" y2="198" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/></svg>
