<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" fill="currentColor"><title id="t">Agent evaluation loop with tasks, trials and graders</title><desc id="d">A task runs as an agent trial that produces a transcript. Code, model and human graders score it. The loop repeats k times.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="420" rx="8" fill="#ffffff"/><defs><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ad9534f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9534f"/></marker><marker id="a3a9d6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a9d6e"/></marker><marker id="a4a8fd8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a8fd8"/></marker></defs><rect x="150" y="10" width="180" height="44" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="240.0" y="36.9" text-anchor="middle" font-size="14">Task + environment</text><line x1="240" y1="54" x2="240" y2="76" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="150" y="76" width="180" height="44" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="240.0" y="102.9" text-anchor="middle" font-size="14">Agent trial</text><line x1="240" y1="120" x2="240" y2="142" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="150" y="142" width="180" height="44" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="240.0" y="168.9" text-anchor="middle" font-size="14">Transcript + final state</text><line x1="240" y1="186" x2="240" y2="208" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="10" y="208" width="140" height="56" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="80.0" y="232.1" text-anchor="middle" font-size="13">Code grader</text><text x="80.0" y="249.0" text-anchor="middle" font-size="13">checks outcome</text><rect x="170" y="208" width="140" height="56" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="240.0" y="232.1" text-anchor="middle" font-size="13">Model grader</text><text x="240.0" y="249.0" text-anchor="middle" font-size="13">rubric</text><rect x="330" y="208" width="140" height="56" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="400.0" y="232.1" text-anchor="middle" font-size="13">Human grader</text><text x="400.0" y="249.0" text-anchor="middle" font-size="13">spot checks</text><line x1="240" y1="186" x2="80" y2="208" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><line x1="240" y1="186" x2="400" y2="208" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><line x1="80" y1="264" x2="240" y2="296" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><line x1="240" y1="264" x2="240" y2="296" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><line x1="400" y1="264" x2="240" y2="296" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="150" y="296" width="180" height="44" rx="6" fill="#4a8fd8" fill-opacity="0.10" stroke="#4a8fd8" stroke-width="1.6"/><text x="240.0" y="322.9" text-anchor="middle" font-size="14" font-weight="700">Score</text><text x="240" y="372.1" text-anchor="middle" font-size="13">Repeat k times: pass@k = at least one success,</text><text x="240" y="389.0" text-anchor="middle" font-size="13">pass^k = all k succeed</text></svg>
