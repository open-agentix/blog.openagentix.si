<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="t d"><title id="t">Code, model and human graders compared, with calibration loop</title><desc id="d">Three grader types. Code graders are cheap, fast and fully trusted for what they can check. Model graders are medium cost, fast and need calibration. Human graders are expensive, slow and the reference. An arrow loops human labels back to calibrate the model grader.</desc>
<g font-family="system-ui,sans-serif" stroke="currentColor" stroke-width="2" fill="none" font-size="13">
<rect x="10" y="10" width="140" height="130" rx="8"/><rect x="170" y="10" width="140" height="130" rx="8"/><rect x="330" y="10" width="140" height="130" rx="8"/>
<g stroke="none"><text fill="currentColor" x="80" y="36" text-anchor="middle" font-weight="700" font-size="15">Code</text><text fill="currentColor" x="80" y="62" text-anchor="middle">cost: low</text><text fill="currentColor" x="80" y="82" text-anchor="middle">speed: fast</text><text fill="currentColor" x="80" y="102" text-anchor="middle">trust: exact</text><text fill="currentColor" x="80" y="122" text-anchor="middle" opacity=".75">checkable only</text>
<text fill="currentColor" x="240" y="36" text-anchor="middle" font-weight="700" font-size="15">Model</text><text fill="currentColor" x="240" y="62" text-anchor="middle">cost: medium</text><text fill="currentColor" x="240" y="82" text-anchor="middle">speed: fast</text><text fill="currentColor" x="240" y="102" text-anchor="middle">trust: calibrate</text><text fill="currentColor" x="240" y="122" text-anchor="middle" opacity=".75">biases apply</text>
<text fill="currentColor" x="400" y="36" text-anchor="middle" font-weight="700" font-size="15">Human</text><text fill="currentColor" x="400" y="62" text-anchor="middle">cost: high</text><text fill="currentColor" x="400" y="82" text-anchor="middle">speed: slow</text><text fill="currentColor" x="400" y="102" text-anchor="middle">trust: reference</text><text fill="currentColor" x="400" y="122" text-anchor="middle" opacity=".75">small samples</text></g>
<path d="M400 140 V200 H240 V150"/><path d="M233 160 L240 148 L247 160"/>
<text fill="currentColor" x="320" y="224" text-anchor="middle" stroke="none">labels</text>
<rect x="110" y="250" width="260" height="56" rx="8"/><text fill="currentColor" x="240" y="274" text-anchor="middle" stroke="none">Calibration loop</text><text fill="currentColor" x="240" y="294" text-anchor="middle" stroke="none" opacity=".75">agreement with humans</text>
<line x1="240" y1="250" x2="240" y2="236" opacity="0"/>
</g></svg>
