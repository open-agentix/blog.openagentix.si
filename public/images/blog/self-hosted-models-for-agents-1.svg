<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Local runtime versus batched serving for self-hosted models</title><desc id="d">Left: a single-node local runtime for one team. Right: a batched serving cluster for many agents. Each lists the operations work you take on.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b4a6b"/></marker></defs><rect width="480" height="320" rx="12" fill="#f5f7fb"/><rect x="14" y="16" width="214" height="70" rx="8" fill="#dbe7ff" stroke="#3b4a6b" stroke-width="1.5"/><text x="121.0" y="46.5" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Local runtime</text><text x="121.0" y="64.5" text-anchor="middle" font-size="13" fill="#1b2433">one node, one team</text><rect x="252" y="16" width="214" height="70" rx="8" fill="#ffe9c7" stroke="#3b4a6b" stroke-width="1.5"/><text x="359.0" y="46.5" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Batched serving</text><text x="359.0" y="64.5" text-anchor="middle" font-size="13" fill="#1b2433">GPU pool, many agents</text><rect x="14" y="104" width="214" height="204" rx="8" fill="#ffffff" stroke="#3b4a6b" stroke-width="1.5"/><text x="121.0" y="165.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">You operate:</text><text x="121.0" y="183.6" text-anchor="middle" font-size="13" fill="#1b2433">model updates</text><text x="121.0" y="201.6" text-anchor="middle" font-size="13" fill="#1b2433">quantization choice</text><text x="121.0" y="219.6" text-anchor="middle" font-size="13" fill="#1b2433">hardware limits</text><text x="121.0" y="237.6" text-anchor="middle" font-size="13" fill="#1b2433">eval on every swap</text><text x="121.0" y="255.6" text-anchor="middle" font-size="13" fill="#1b2433">weights from verified source</text><rect x="252" y="104" width="214" height="204" rx="8" fill="#ffffff" stroke="#3b4a6b" stroke-width="1.5"/><text x="359.0" y="165.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">You also operate:</text><text x="359.0" y="183.6" text-anchor="middle" font-size="13" fill="#1b2433">capacity and queueing</text><text x="359.0" y="201.6" text-anchor="middle" font-size="13" fill="#1b2433">autoscaling, GPU health</text><text x="359.0" y="219.6" text-anchor="middle" font-size="13" fill="#1b2433">version pinning</text><text x="359.0" y="237.6" text-anchor="middle" font-size="13" fill="#1b2433">latency SLOs</text><text x="359.0" y="255.6" text-anchor="middle" font-size="13" fill="#1b2433">weights from verified source</text></svg>
