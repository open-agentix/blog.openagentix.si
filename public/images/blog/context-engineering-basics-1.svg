<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" fill="currentColor"><title id="t">Breakdown of what fills an agent's context window</title><desc id="d">A stacked bar of a context window with system prompt, tool definitions, skill metadata, history and the current task, and the technique that shrinks each part.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="340" rx="8" fill="#ffffff"/><defs><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ad9534f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9534f"/></marker><marker id="a3a9d6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a9d6e"/></marker><marker id="a4a8fd8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a8fd8"/></marker></defs><rect x="10" y="10" width="170" height="34" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="95.0" y="31.6" text-anchor="middle" font-size="13">System prompt</text><line x1="190" y1="27.0" x2="215" y2="27.0" stroke="#3a9d6e" stroke-width="1.8" marker-end="url(#a3a9d6e)"/><text x="222" y="31.6" text-anchor="start" font-size="13">keep short</text><rect x="10" y="50" width="170" height="64" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="95.0" y="86.5" text-anchor="middle" font-size="13">Tool definitions</text><line x1="190" y1="82.0" x2="215" y2="82.0" stroke="#3a9d6e" stroke-width="1.8" marker-end="url(#a3a9d6e)"/><text x="222" y="86.5" text-anchor="start" font-size="13">load on demand, code execution</text><rect x="10" y="120" width="170" height="34" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="95.0" y="141.6" text-anchor="middle" font-size="13">Skills metadata</text><line x1="190" y1="137.0" x2="215" y2="137.0" stroke="#3a9d6e" stroke-width="1.8" marker-end="url(#a3a9d6e)"/><text x="222" y="141.6" text-anchor="start" font-size="13">progressive disclosure</text><rect x="10" y="160" width="170" height="84" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="95.0" y="206.6" text-anchor="middle" font-size="13">History</text><line x1="190" y1="202.0" x2="215" y2="202.0" stroke="#3a9d6e" stroke-width="1.8" marker-end="url(#a3a9d6e)"/><text x="222" y="206.6" text-anchor="start" font-size="13">compaction, notes</text><rect x="10" y="250" width="170" height="44" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="95.0" y="276.6" text-anchor="middle" font-size="13">Current task</text><line x1="190" y1="272.0" x2="215" y2="272.0" stroke="#3a9d6e" stroke-width="1.8" marker-end="url(#a3a9d6e)"/><text x="222" y="276.6" text-anchor="start" font-size="13">sub-task with own context</text><text x="10" y="320" font-size="13">Fixed budget: every part competes for the same tokens</text></svg>
