<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d" fill="none" font-family="system-ui, sans-serif" color="currentColor">
<title id="t">Interface contract card for an agent handover</title>
<desc id="d">A contract card lists the input schema, output schema, owner, version and compatibility rule of one handover between two agents.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="320" rx="8" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<g fill="currentColor">
<rect x="10" y="10" width="460" height="300" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="30" y="42" text-anchor="start" font-size="17" font-weight="700">Contract: triage -&gt; notify</text>
<line x1="30" y1="54" x2="450" y2="54" stroke="currentColor" stroke-width="1"/>
<text x="30" y="86" text-anchor="start" font-size="15" font-weight="700">Input schema</text>
<text x="170" y="86" text-anchor="start" font-size="15">CveFinding (JSON Schema)</text>
<text x="30" y="120" text-anchor="start" font-size="15" font-weight="700">Output schema</text>
<text x="170" y="120" text-anchor="start" font-size="15">TicketComment (JSON Schema)</text>
<text x="30" y="154" text-anchor="start" font-size="15" font-weight="700">Owner</text>
<text x="170" y="154" text-anchor="start" font-size="15">team that owns the producer</text>
<text x="30" y="188" text-anchor="start" font-size="15" font-weight="700">Version</text>
<text x="170" y="188" text-anchor="start" font-size="15">2.1.0 (SemVer)</text>
<text x="30" y="222" text-anchor="start" font-size="15" font-weight="700">Compatibility</text>
<text x="170" y="222" text-anchor="start" font-size="15">minor: add optional fields only;</text>
<text x="30" y="256" text-anchor="start" font-size="15" font-weight="700"></text>
<text x="170" y="256" text-anchor="start" font-size="15">major: required or removed field</text>
<text x="30" y="298" text-anchor="start" font-size="14">Change process: owner proposes, consumers review.</text>
</g>
</svg>
