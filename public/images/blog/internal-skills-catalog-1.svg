<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 238" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif" fill="currentColor">
<title id="t">Workflow of an internal skills catalog</title>
<desc id="d">Four steps: a team submits a skill, it is reviewed for security and by an eval, it is published with a version and an owner, and later deprecated.</desc>
<rect x="10" y="10" width="460" height="48" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<text x="22" y="31.0" font-size="15" font-weight="700">1 Submit</text>
<text x="22" y="49.0" font-size="13" fill-opacity="0.8">pull request with SKILL.md and an eval</text>
<rect x="10" y="66" width="460" height="48" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<text x="22" y="87.0" font-size="15" font-weight="700">2 Review</text>
<text x="22" y="105.0" font-size="13" fill-opacity="0.8">security check, eval run, owner named</text>
<rect x="10" y="122" width="460" height="48" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<text x="22" y="143.0" font-size="15" font-weight="700">3 Publish</text>
<text x="22" y="161.0" font-size="13" fill-opacity="0.8">version tag, owner, searchable entry</text>
<rect x="10" y="178" width="460" height="48" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<text x="22" y="199.0" font-size="15" font-weight="700">4 Deprecate</text>
<text x="22" y="217.0" font-size="13" fill-opacity="0.8">replacement named, removal date set</text>
</svg>
