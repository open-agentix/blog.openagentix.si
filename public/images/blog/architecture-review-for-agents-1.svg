<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 406" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif" fill="currentColor">
<title id="t">One-page architecture review template for agent systems</title>
<desc id="d">Seven sections of a one-page review: purpose, boundaries, data flow, contracts, autonomy level, failure paths, owners.</desc>
<rect x="10" y="10" width="460" height="48" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<text x="22" y="31.0" font-size="15" font-weight="700">Purpose</text>
<text x="22" y="49.0" font-size="13" fill-opacity="0.8">one sentence, one measurable outcome</text>
<rect x="10" y="66" width="460" height="48" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<text x="22" y="87.0" font-size="15" font-weight="700">Boundaries</text>
<text x="22" y="105.0" font-size="13" fill-opacity="0.8">what the agent may touch, and what not</text>
<rect x="10" y="122" width="460" height="48" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<text x="22" y="143.0" font-size="15" font-weight="700">Data flow</text>
<text x="22" y="161.0" font-size="13" fill-opacity="0.8">sources, sinks, trust level of each</text>
<rect x="10" y="178" width="460" height="48" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<text x="22" y="199.0" font-size="15" font-weight="700">Contracts</text>
<text x="22" y="217.0" font-size="13" fill-opacity="0.8">typed hand-offs between agents and tools</text>
<rect x="10" y="234" width="460" height="48" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<text x="22" y="255.0" font-size="15" font-weight="700">Autonomy level</text>
<text x="22" y="273.0" font-size="13" fill-opacity="0.8">who approves which action</text>
<rect x="10" y="290" width="460" height="48" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<text x="22" y="311.0" font-size="15" font-weight="700">Failure paths</text>
<text x="22" y="329.0" font-size="13" fill-opacity="0.8">timeouts, retries, stop and escalate</text>
<rect x="10" y="346" width="460" height="48" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/>
<text x="22" y="367.0" font-size="15" font-weight="700">Owners</text>
<text x="22" y="385.0" font-size="13" fill-opacity="0.8">named team, on-call, review date</text>
</svg>
