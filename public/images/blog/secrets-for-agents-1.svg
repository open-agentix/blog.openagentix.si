<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" fill="currentColor"><title id="t">Credentials stay in the tool runtime, outside the model context</title><desc id="d">Left: the model context sees only tool names and handles. Right: the tool runtime injects credentials from a vault. A boundary separates both.</desc><defs><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ad9534f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9534f"/></marker><marker id="a3a9d6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a9d6e"/></marker><marker id="a4a8fd8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a8fd8"/></marker></defs><rect x="10" y="10" width="200" height="310" rx="6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4"/><text x="110" y="33.9" text-anchor="middle" font-size="14" font-weight="700">Model context</text><rect x="30" y="60" width="160" height="56" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="110.0" y="92.9" text-anchor="middle" font-size="14">Tool names</text><rect x="30" y="130" width="160" height="56" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="110.0" y="154.1" text-anchor="middle" font-size="13">Handles</text><text x="110.0" y="171.0" text-anchor="middle" font-size="13">(crm.read, repo.write)</text><rect x="30" y="200" width="160" height="56" rx="6" fill="#3a9d6e" fill-opacity="0.10" stroke="#3a9d6e" stroke-width="1.6"/><text x="110.0" y="223.8" text-anchor="middle" font-size="14">Prompt, history</text><text x="110.0" y="242.0" text-anchor="middle" font-size="14">no secrets</text><rect x="270" y="10" width="200" height="310" rx="6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4"/><text x="370" y="33.9" text-anchor="middle" font-size="14" font-weight="700">Tool runtime</text><rect x="290" y="60" width="160" height="56" rx="6" fill="#4a8fd8" fill-opacity="0.10" stroke="#4a8fd8" stroke-width="1.6"/><text x="370.0" y="92.9" text-anchor="middle" font-size="14">Per-tool credential</text><rect x="290" y="130" width="160" height="56" rx="6" fill="#4a8fd8" fill-opacity="0.10" stroke="#4a8fd8" stroke-width="1.6"/><text x="370.0" y="154.1" text-anchor="middle" font-size="13">Vault injects</text><text x="370.0" y="171.0" text-anchor="middle" font-size="13">at call time</text><rect x="290" y="200" width="160" height="56" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="370.0" y="232.9" text-anchor="middle" font-size="14">Real API call</text><line x1="190" y1="158" x2="290" y2="158" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><line x1="190" y1="158" x2="290" y2="158" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><text x="240" y="276.2" text-anchor="middle" font-size="12">call by handle</text><text x="240" y="310.2" text-anchor="middle" font-size="12" fill="#d9534f">secret never crosses</text></svg>
