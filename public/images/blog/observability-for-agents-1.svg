<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-labelledby="t d"><title id="t">Trace waterfall of an agent run with model and tool spans</title><desc id="d">A waterfall of one agent run as a trace: a root run span, a plan span, two model call spans, tool call spans, a policy decision event and an approval wait. Spans carry tokens, cost and decision attributes.</desc><style>text{fill:currentColor;font:14px sans-serif}.h{font-weight:600}.b{fill:none;stroke:currentColor;stroke-width:1.5;stroke-opacity:.75}.f{fill:currentColor;fill-opacity:.07}.a{stroke:var(--accent,#6d28d9);stroke-opacity:1;stroke-width:2}.at{fill:var(--accent,#6d28d9)}.r{stroke:var(--danger,#be123c);stroke-width:2}.rt{fill:var(--danger,#be123c)}.d{stroke-dasharray:6 4}.l{stroke:currentColor;stroke-width:1.5;stroke-opacity:.75;fill:none}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><text x="10" y="24" text-anchor="start" class="h">One agent run (trace)</text><text x="10" y="55" text-anchor="start" class="">run</text><rect x="150.0" y="40" width="308.0" height="18" rx="3" class="b f a"/><text x="10" y="85" text-anchor="start" class="">plan span</text><rect x="150.0" y="70" width="49.0" height="18" rx="3" class="b f"/><text x="10" y="115" text-anchor="start" class="">model call 1</text><rect x="178.0" y="100" width="84.0" height="18" rx="3" class="b f"/><text x="10" y="145" text-anchor="start" class="">tool: tickets.read</text><rect x="241.0" y="130" width="42.0" height="18" rx="3" class="b f"/><text x="10" y="175" text-anchor="start" class="">policy decision</text><rect x="283.0" y="160" width="8.399999999999999" height="18" rx="3" class="b f a"/><text x="10" y="205" text-anchor="start" class="">model call 2</text><rect x="293.5" y="190" width="70.0" height="18" rx="3" class="b f"/><text x="10" y="235" text-anchor="start" class="">tool: issue.create</text><rect x="374.0" y="220" width="49.0" height="18" rx="3" class="b f"/><text x="10" y="265" text-anchor="start" class="">approval wait</text><rect x="381.0" y="250" width="70.0" height="18" rx="3" class="b f"/><text x="10" y="298" text-anchor="start" class="h">Span attributes:</text><text x="10" y="320" text-anchor="start" class="">tokens in/out, cost, model, tool name,</text><text x="10" y="340" text-anchor="start" class="">policy decision (allow / deny / approval)</text><text x="10" y="364" text-anchor="start" class="">Events: decisions. Errors: status on the span.</text></svg>
