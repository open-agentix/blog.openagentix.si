<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 412" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14" fill="currentColor">
<title id="t">Classic operations disciplines mapped to agent platform concerns</title>
<desc id="d">Twelve classic operations disciplines on the left, each paired with its counterpart for an agent platform on the right.</desc>
<rect x="8" y="8" width="214" height="30" rx="6" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
<text x="115" y="29" text-anchor="middle" font-weight="700">Classic discipline</text>
<rect x="248" y="8" width="264" height="30" rx="6" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
<text x="380" y="29" text-anchor="middle" font-weight="700">Agent platform concern</text>
<rect x="8" y="46" width="504" height="26" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/>
<text x="18" y="64" text-anchor="start">Identity</text>
<text x="235" y="64" text-anchor="middle" font-size="16">→</text>
<text x="258" y="64" text-anchor="start">Per-agent identity, acting-for</text>
<rect x="8" y="76" width="504" height="26" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/>
<text x="18" y="94" text-anchor="start">Least privilege</text>
<text x="235" y="94" text-anchor="middle" font-size="16">→</text>
<text x="258" y="94" text-anchor="start">Per-agent tool allowlists</text>
<rect x="8" y="106" width="504" height="26" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/>
<text x="18" y="124" text-anchor="start">Change management</text>
<text x="235" y="124" text-anchor="middle" font-size="16">→</text>
<text x="258" y="124" text-anchor="start">Versioned agent definitions</text>
<rect x="8" y="136" width="504" height="26" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/>
<text x="18" y="154" text-anchor="start">Deployments</text>
<text x="235" y="154" text-anchor="middle" font-size="16">→</text>
<text x="258" y="154" text-anchor="start">Staged rollout of agents</text>
<rect x="8" y="166" width="504" height="26" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/>
<text x="18" y="184" text-anchor="start">Observability</text>
<text x="235" y="184" text-anchor="middle" font-size="16">→</text>
<text x="258" y="184" text-anchor="start">Run traces, tool-call logs</text>
<rect x="8" y="196" width="504" height="26" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/>
<text x="18" y="214" text-anchor="start">Incident response</text>
<text x="235" y="214" text-anchor="middle" font-size="16">→</text>
<text x="258" y="214" text-anchor="start">Kill switch, replay of runs</text>
<rect x="8" y="226" width="504" height="26" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/>
<text x="18" y="244" text-anchor="start">SLOs</text>
<text x="235" y="244" text-anchor="middle" font-size="16">→</text>
<text x="258" y="244" text-anchor="start">Success rate, latency, review time</text>
<rect x="8" y="256" width="504" height="26" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/>
<text x="18" y="274" text-anchor="start">Cost</text>
<text x="235" y="274" text-anchor="middle" font-size="16">→</text>
<text x="258" y="274" text-anchor="start">Budgets per agent and run</text>
<rect x="8" y="286" width="504" height="26" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/>
<text x="18" y="304" text-anchor="start">Audit</text>
<text x="235" y="304" text-anchor="middle" font-size="16">→</text>
<text x="258" y="304" text-anchor="start">Tamper-evident decision log</text>
<rect x="8" y="316" width="504" height="26" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/>
<text x="18" y="334" text-anchor="start">Runbooks</text>
<text x="235" y="334" text-anchor="middle" font-size="16">→</text>
<text x="258" y="334" text-anchor="start">Skills with owners</text>
<rect x="8" y="346" width="504" height="26" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/>
<text x="18" y="364" text-anchor="start">Patching</text>
<text x="235" y="364" text-anchor="middle" font-size="16">→</text>
<text x="258" y="364" text-anchor="start">Model and dependency updates</text>
<rect x="8" y="376" width="504" height="26" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1"/>
<text x="18" y="394" text-anchor="start">Secrets</text>
<text x="235" y="394" text-anchor="middle" font-size="16">→</text>
<text x="258" y="394" text-anchor="start">Brokered, never in prompts</text>
</svg>
