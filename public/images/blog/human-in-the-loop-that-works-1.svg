<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t d"><title id="t">Risk-based routing of agent actions to policy or human approval</title><desc id="d">Every tool call is classified by risk. Low risk is allowed by policy, medium risk is allowed and written to the audit log, high risk goes to a human with a diff and context.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="340" rx="8" fill="#ffffff"/>
<g font-family="system-ui,sans-serif" font-size="15" stroke="currentColor" stroke-width="2" fill="none">
<rect x="150" y="10" width="180" height="46" rx="8"/><text fill="currentColor" x="240" y="39" text-anchor="middle" stroke="none">Tool call + risk class</text>
<line x1="240" y1="56" x2="240" y2="76"/><line x1="70" y1="76" x2="410" y2="76"/><line x1="70" y1="76" x2="70" y2="106"/><line x1="240" y1="76" x2="240" y2="106"/><line x1="410" y1="76" x2="410" y2="106"/>
<rect x="10" y="106" width="120" height="70" rx="8"/><text fill="currentColor" x="70" y="132" text-anchor="middle" stroke="none" font-weight="700">Low</text><text fill="currentColor" x="70" y="154" text-anchor="middle" stroke="none" font-size="13">read-only</text>
<rect x="180" y="106" width="120" height="70" rx="8"/><text fill="currentColor" x="240" y="132" text-anchor="middle" stroke="none" font-weight="700">Medium</text><text fill="currentColor" x="240" y="154" text-anchor="middle" stroke="none" font-size="13">scoped writes</text>
<rect x="350" y="106" width="120" height="70" rx="8"/><text fill="currentColor" x="410" y="132" text-anchor="middle" stroke="none" font-weight="700">High</text><text fill="currentColor" x="410" y="154" text-anchor="middle" stroke="none" font-size="13">irreversible</text>
<line x1="70" y1="176" x2="70" y2="206"/><line x1="240" y1="176" x2="240" y2="206"/><line x1="410" y1="176" x2="410" y2="206"/>
<rect x="10" y="206" width="120" height="60" rx="8"/><text fill="currentColor" x="70" y="241" text-anchor="middle" stroke="none">Allow by policy</text>
<rect x="180" y="206" width="120" height="60" rx="8"/><text fill="currentColor" x="240" y="231" text-anchor="middle" stroke="none">Allow, and</text><text fill="currentColor" x="240" y="250" text-anchor="middle" stroke="none">audit</text>
<rect x="350" y="206" width="120" height="60" rx="8"/><text fill="currentColor" x="410" y="231" text-anchor="middle" stroke="none">Human decides</text><text fill="currentColor" x="410" y="250" text-anchor="middle" stroke="none" font-size="13">diff + context</text>
<text fill="currentColor" x="240" y="305" text-anchor="middle" stroke="none" opacity=".75" font-size="13">Few approvals, each one worth reading</text>
</g></svg>
