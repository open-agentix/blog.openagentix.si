<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 492 196" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14" fill="currentColor">
<title id="t">One broad tool split into narrow tools</title>
<desc id="d">Before: a single do_anything tool with free-form inputs. After: three namespaced tools, each with a narrow schema.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<text x="100" y="24" text-anchor="middle" font-weight="700">Before</text>
<text x="370" y="24" text-anchor="middle" font-weight="700">After</text>
<rect x="10" y="36" width="180" height="120" rx="6" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
<text x="100" y="70" text-anchor="middle" font-weight="700">do_anything</text>
<text x="100" y="96" text-anchor="middle" font-size="13">action: string</text>
<text x="100" y="116" text-anchor="middle" font-size="13">target: string</text>
<text x="100" y="136" text-anchor="middle" font-size="13">payload: object</text>
<line x1="196" y1="96" x2="246" y2="96" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="252" y="36" width="230" height="44" rx="6" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
<text x="367" y="55" text-anchor="middle" font-weight="700" font-size="14">crm.read_ticket</text>
<text x="367" y="72" text-anchor="middle" font-size="12">id: string</text>
<rect x="252" y="88" width="230" height="44" rx="6" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
<text x="367" y="107" text-anchor="middle" font-weight="700" font-size="14">crm.add_comment</text>
<text x="367" y="124" text-anchor="middle" font-size="12">id, text ≤ 2000</text>
<rect x="252" y="140" width="230" height="44" rx="6" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
<text x="367" y="159" text-anchor="middle" font-weight="700" font-size="14">git.open_pr</text>
<text x="367" y="176" text-anchor="middle" font-size="12">repo, branch</text>
</svg>
