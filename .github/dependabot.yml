version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: build(deps)
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      test:
        patterns: ['vitest', '@vitest/*', 'happy-dom', '@lhci/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
