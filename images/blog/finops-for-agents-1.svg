<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="t d" fill="none" font-family="system-ui, sans-serif" color="currentColor">
<title id="t">Cost attribution flow from run to report</title>
<desc id="d">A run produces model and tool line items. Tags for tenant, agent and use case are attached, a budget check runs, and the data is exported to the cost report.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="330" rx="8" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<g fill="currentColor">
<rect x="90" y="8" width="300" height="44" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="240.0" y="35.2" text-anchor="middle" font-size="15" font-weight="700">Agent run</text>
<line x1="240" y1="52" x2="240" y2="68" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="90" y="70" width="300" height="44" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="240.0" y="88.2" text-anchor="middle" font-size="15" font-weight="700">Line items</text>
<text x="240.0" y="106.2" text-anchor="middle" font-size="15">model + tool calls</text>
<line x1="240" y1="114" x2="240" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="90" y="132" width="300" height="44" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="240.0" y="150.2" text-anchor="middle" font-size="15" font-weight="700">Tags</text>
<text x="240.0" y="168.2" text-anchor="middle" font-size="15">tenant, agent, use case</text>
<line x1="240" y1="176" x2="240" y2="192" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="90" y="194" width="300" height="44" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="240.0" y="212.2" text-anchor="middle" font-size="15" font-weight="700">Budget check</text>
<text x="240.0" y="230.2" text-anchor="middle" font-size="15">alert or stop</text>
<line x1="240" y1="238" x2="240" y2="254" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="90" y="256" width="300" height="44" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="240.0" y="274.2" text-anchor="middle" font-size="15" font-weight="700">Export</text>
<text x="240.0" y="292.2" text-anchor="middle" font-size="15">existing cost report</text>
</g>
</svg>
