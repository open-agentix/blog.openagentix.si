<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t d" fill="none" font-family="system-ui, sans-serif" color="currentColor">
<title id="t">Direct tool calls compared with sandboxed code execution</title>
<desc id="d">Left: with direct tool calls every intermediate result passes through the model. Right: a sandboxed script processes the data and returns only a summary to the model.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="340" rx="8" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<g fill="currentColor">
<text x="110" y="24" text-anchor="middle" font-size="16" font-weight="700">Direct tool calls</text>
<text x="370" y="24" text-anchor="middle" font-size="16" font-weight="700">Code execution</text>
<line x1="240" y1="40" x2="240" y2="330" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="40" y="44" width="140" height="40" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="110.0" y="69.2" text-anchor="middle" font-size="15" font-weight="700">Model</text>
<rect x="40" y="130" width="140" height="40" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="110.0" y="155.2" text-anchor="middle" font-size="15">Tool A</text>
<rect x="40" y="230" width="140" height="40" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="110.0" y="255.2" text-anchor="middle" font-size="15">Tool B</text>
<line x1="90" y1="84" x2="90" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="130" y1="130" x2="130" y2="84" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<text x="86" y="112" text-anchor="end" font-size="13">call</text>
<text x="134" y="112" text-anchor="start" font-size="13">full result</text>
<text x="110" y="200" text-anchor="middle" font-size="13">every result goes</text>
<text x="110" y="216" text-anchor="middle" font-size="13">back through the model</text>
<rect x="40" y="290" width="140" height="36" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="110.0" y="312.9" text-anchor="middle" font-size="14">many tokens</text>
<rect x="300" y="44" width="140" height="40" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="370.0" y="69.2" text-anchor="middle" font-size="15" font-weight="700">Model</text>
<rect x="300" y="130" width="140" height="70" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="370.0" y="152.9" text-anchor="middle" font-size="14">Sandbox</text>
<text x="370.0" y="169.9" text-anchor="middle" font-size="14">script runs</text>
<text x="370.0" y="186.9" text-anchor="middle" font-size="14">tools A + B</text>
<line x1="340" y1="84" x2="340" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="400" y1="130" x2="400" y2="84" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<text x="334" y="112" text-anchor="end" font-size="13">code</text>
<text x="406" y="112" text-anchor="start" font-size="13">summary</text>
<text x="370" y="226" text-anchor="middle" font-size="13">filter, join, count</text>
<text x="370" y="242" text-anchor="middle" font-size="13">inside the sandbox</text>
<rect x="300" y="290" width="140" height="36" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="370.0" y="312.9" text-anchor="middle" font-size="14">few tokens</text>
</g>
</svg>
