<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" fill="currentColor"><title id="t">Monolithic MCP server versus one server per system</title><desc id="d">Left: one server wraps ten backends and holds all credentials. Right: small servers, each bound to one system and one credential.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="400" rx="8" fill="#ffffff"/><defs><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ad9534f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9534f"/></marker><marker id="a3a9d6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a9d6e"/></marker><marker id="a4a8fd8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a8fd8"/></marker></defs><text x="120" y="21.9" text-anchor="middle" font-size="14" font-weight="700">One big server</text><text x="360" y="21.9" text-anchor="middle" font-size="14" font-weight="700">One per system</text><rect x="20" y="40" width="200" height="70" rx="6" fill="#d9534f" fill-opacity="0.10" stroke="#d9534f" stroke-width="1.6"/><text x="120.0" y="71.1" text-anchor="middle" font-size="13">Swiss army knife</text><text x="120.0" y="88.0" text-anchor="middle" font-size="13">all credentials</text><rect x="20" y="170" width="36" height="30" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="38.0" y="188.8" text-anchor="middle" font-size="11">S1</text><line x1="38" y1="110" x2="38" y2="170" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="60" y="170" width="36" height="30" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="78.0" y="188.8" text-anchor="middle" font-size="11">S2</text><line x1="78" y1="110" x2="78" y2="170" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="100" y="170" width="36" height="30" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="118.0" y="188.8" text-anchor="middle" font-size="11">S3</text><line x1="118" y1="110" x2="118" y2="170" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="140" y="170" width="36" height="30" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="158.0" y="188.8" text-anchor="middle" font-size="11">S4</text><line x1="158" y1="110" x2="158" y2="170" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="180" y="170" width="36" height="30" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="198.0" y="188.8" text-anchor="middle" font-size="11">S5</text><line x1="198" y1="110" x2="198" y2="170" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><text x="120" y="221.6" text-anchor="middle" font-size="13">... 10 backends</text><text x="120" y="261.1" text-anchor="middle" font-size="13" fill="#d9534f">Every permission blurred,</text><text x="120" y="278.0" text-anchor="middle" font-size="13" fill="#d9534f">one leak exposes all</text><rect x="260" y="40" width="90" height="50" rx="6" fill="#3a9d6e" fill-opacity="0.10" stroke="#3a9d6e" stroke-width="1.6"/><text x="305.0" y="61.4" text-anchor="middle" font-size="12">Server 1</text><text x="305.0" y="77.0" text-anchor="middle" font-size="12">1 credential</text><line x1="350" y1="65" x2="380" y2="65" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="380" y="40" width="90" height="50" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="425.0" y="69.5" text-anchor="middle" font-size="13">System 1</text><rect x="260" y="106" width="90" height="50" rx="6" fill="#3a9d6e" fill-opacity="0.10" stroke="#3a9d6e" stroke-width="1.6"/><text x="305.0" y="127.4" text-anchor="middle" font-size="12">Server 2</text><text x="305.0" y="143.0" text-anchor="middle" font-size="12">1 credential</text><line x1="350" y1="131" x2="380" y2="131" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="380" y="106" width="90" height="50" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="425.0" y="135.6" text-anchor="middle" font-size="13">System 2</text><rect x="260" y="172" width="90" height="50" rx="6" fill="#3a9d6e" fill-opacity="0.10" stroke="#3a9d6e" stroke-width="1.6"/><text x="305.0" y="193.4" text-anchor="middle" font-size="12">Server 3</text><text x="305.0" y="209.0" text-anchor="middle" font-size="12">1 credential</text><line x1="350" y1="197" x2="380" y2="197" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="380" y="172" width="90" height="50" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="425.0" y="201.6" text-anchor="middle" font-size="13">System 3</text><text x="360" y="256.9" text-anchor="middle" font-size="14">...</text><text x="360" y="296.1" text-anchor="middle" font-size="13" fill="#3a9d6e">Namespaced tools,</text><text x="360" y="313.0" text-anchor="middle" font-size="13" fill="#3a9d6e">read and write separated</text></svg>
