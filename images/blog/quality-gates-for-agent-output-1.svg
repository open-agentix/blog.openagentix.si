<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 377" role="img" aria-labelledby="t d"><title id="t">Funnel of automated gates before human review</title><desc id="d">Agent output passes automated gates in order: tests, eval suite, policy check and size limit. Only what passes reaches human review, so most rejections happen before a person reads anything.</desc><style>text{fill:currentColor;font:14px sans-serif}.h{font-weight:600}.b{fill:none;stroke:currentColor;stroke-width:1.5;stroke-opacity:.75}.f{fill:currentColor;fill-opacity:.07}.a{stroke:var(--accent,#6d28d9);stroke-opacity:1;stroke-width:2}.at{fill:var(--accent,#6d28d9)}.r{stroke:var(--danger,#be123c);stroke-width:2}.rt{fill:var(--danger,#be123c)}.d{stroke-dasharray:6 4}.l{stroke:currentColor;stroke-width:1.5;stroke-opacity:.75;fill:none}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><rect x="20.0" y="10" width="440" height="38" rx="6" class="b f"/><text x="240.0" y="34.0" text-anchor="middle" class="">Agent output</text><line x1="240" y1="48" x2="240" y2="62" class="l" marker-end="url(#m)"/><text x="470" y="68" text-anchor="start" class=""></text><rect x="50.0" y="62" width="380" height="38" rx="6" class="b f"/><text x="240.0" y="86.0" text-anchor="middle" class="">Tests pass</text><line x1="240" y1="100" x2="240" y2="114" class="l" marker-end="url(#m)"/><text x="438.0" y="120" text-anchor="start" class=""></text><rect x="80.0" y="114" width="320" height="38" rx="6" class="b f"/><text x="240.0" y="138.0" text-anchor="middle" class="">Eval suite</text><line x1="240" y1="152" x2="240" y2="166" class="l" marker-end="url(#m)"/><text x="408.0" y="172" text-anchor="start" class=""></text><rect x="110.0" y="166" width="260" height="38" rx="6" class="b f"/><text x="240.0" y="190.0" text-anchor="middle" class="">Policy check</text><line x1="240" y1="204" x2="240" y2="218" class="l" marker-end="url(#m)"/><text x="378.0" y="224" text-anchor="start" class=""></text><rect x="140.0" y="218" width="200" height="38" rx="6" class="b f"/><text x="240.0" y="242.0" text-anchor="middle" class="">Size limit</text><line x1="240" y1="256" x2="240" y2="270" class="l" marker-end="url(#m)"/><text x="348.0" y="276" text-anchor="start" class=""></text><rect x="170.0" y="270" width="140" height="38" rx="6" class="b f a"/><text x="240.0" y="294.0" text-anchor="middle" class="at">Human review</text><text x="240" y="340" text-anchor="middle" class="">Most rejections happen before a human reads anything.</text><text x="240" y="360" text-anchor="middle" class="">Each gate returns a reason the agent can act on.</text></svg>
