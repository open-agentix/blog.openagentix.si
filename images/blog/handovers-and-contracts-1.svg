<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" fill="currentColor"><title id="t">Handover between two agents shown as a contract</title><desc id="d">Agent A hands over to agent B through a contract box listing schema, owner, acceptance check and failure path.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="360" rx="8" fill="#ffffff"/><defs><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ad9534f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9534f"/></marker><marker id="a3a9d6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a9d6e"/></marker><marker id="a4a8fd8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a8fd8"/></marker></defs><rect x="10" y="130" width="100" height="70" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="60.0" y="161.1" text-anchor="middle" font-size="13">Agent A</text><text x="60.0" y="178.0" text-anchor="middle" font-size="13">produces</text><rect x="370" y="130" width="100" height="70" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="420.0" y="161.1" text-anchor="middle" font-size="13">Agent B</text><text x="420.0" y="178.0" text-anchor="middle" font-size="13">consumes</text><line x1="110" y1="165" x2="150" y2="165" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><line x1="330" y1="165" x2="370" y2="165" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="150" y="20" width="180" height="300" rx="6" fill="#4a8fd8" fill-opacity="0.10" stroke="#4a8fd8" stroke-width="1.6"/><text x="240" y="43.9" text-anchor="middle" font-size="14" font-weight="700">Handover contract</text><rect x="162" y="64" width="156" height="52" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="240.0" y="86.4" text-anchor="middle" font-size="12" font-weight="700">Schema</text><text x="240.0" y="102.0" text-anchor="middle" font-size="12">typed fields</text><rect x="162" y="126" width="156" height="52" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="240.0" y="148.4" text-anchor="middle" font-size="12" font-weight="700">Owner</text><text x="240.0" y="164.0" text-anchor="middle" font-size="12">one named role</text><rect x="162" y="188" width="156" height="52" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="240.0" y="210.4" text-anchor="middle" font-size="12" font-weight="700">Acceptance</text><text x="240.0" y="226.0" text-anchor="middle" font-size="12">check before use</text><rect x="162" y="250" width="156" height="52" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="240.0" y="272.4" text-anchor="middle" font-size="12" font-weight="700">Failure path</text><text x="240.0" y="288.0" text-anchor="middle" font-size="12">retry, escalate</text></svg>
