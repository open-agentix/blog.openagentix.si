<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">NIST AI RMF functions mapped to agent platform artefacts</title><desc id="d">Four quadrants for Govern, Map, Measure and Manage, each with the agent platform artefact that supports it: policies, registry and data flow, evals, traces and incident handling.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b4a6b"/></marker></defs><rect width="480" height="320" rx="12" fill="#f5f7fb"/><rect x="14" y="14" width="216" height="134" rx="8" fill="#dbe7ff" stroke="#3b4a6b" stroke-width="1.5"/><text x="122.0" y="66.2" text-anchor="middle" font-size="15" fill="#1b2433" font-weight="700">Govern</text><text x="122.0" y="86.2" text-anchor="middle" font-size="15" fill="#1b2433">policies, owners,</text><text x="122.0" y="106.2" text-anchor="middle" font-size="15" fill="#1b2433">approval rules</text><rect x="250" y="14" width="216" height="134" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="358.0" y="66.2" text-anchor="middle" font-size="15" fill="#1b2433" font-weight="700">Map</text><text x="358.0" y="86.2" text-anchor="middle" font-size="15" fill="#1b2433">agent registry,</text><text x="358.0" y="106.2" text-anchor="middle" font-size="15" fill="#1b2433">data flow, context</text><rect x="14" y="162" width="216" height="134" rx="8" fill="#ffe9c7" stroke="#3b4a6b" stroke-width="1.5"/><text x="122.0" y="214.2" text-anchor="middle" font-size="15" fill="#1b2433" font-weight="700">Measure</text><text x="122.0" y="234.2" text-anchor="middle" font-size="15" fill="#1b2433">evals, traces,</text><text x="122.0" y="254.2" text-anchor="middle" font-size="15" fill="#1b2433">cost and error metrics</text><rect x="250" y="162" width="216" height="134" rx="8" fill="#fbdcdc" stroke="#3b4a6b" stroke-width="1.5"/><text x="358.0" y="214.2" text-anchor="middle" font-size="15" fill="#1b2433" font-weight="700">Manage</text><text x="358.0" y="234.2" text-anchor="middle" font-size="15" fill="#1b2433">gates, rollback,</text><text x="358.0" y="254.2" text-anchor="middle" font-size="15" fill="#1b2433">incident response</text></svg>
