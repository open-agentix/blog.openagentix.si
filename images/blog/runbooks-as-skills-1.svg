<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Runbook converted into a skill and a scoped toolset</title><desc id="d">Runbook steps on the left map to one skill holding the instructions and three scoped tools: read, act with approval, and verify.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b4a6b"/></marker></defs><rect width="480" height="300" rx="12" fill="#f5f7fb"/><rect x="14" y="16" width="170" height="268" rx="8" fill="#ffffff" stroke="#3b4a6b" stroke-width="1.5"/><text x="99.0" y="109.5" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Runbook</text><text x="99.0" y="127.5" text-anchor="middle" font-size="13" fill="#1b2433">1 check alert</text><text x="99.0" y="145.6" text-anchor="middle" font-size="13" fill="#1b2433">2 read metrics</text><text x="99.0" y="163.6" text-anchor="middle" font-size="13" fill="#1b2433">3 restart one pod</text><text x="99.0" y="181.6" text-anchor="middle" font-size="13" fill="#1b2433">4 confirm recovery</text><text x="99.0" y="199.6" text-anchor="middle" font-size="13" fill="#1b2433">5 write note</text><rect x="250" y="16" width="216" height="76" rx="8" fill="#dbe7ff" stroke="#3b4a6b" stroke-width="1.5"/><text x="358.0" y="40.5" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Skill</text><text x="358.0" y="58.5" text-anchor="middle" font-size="13" fill="#1b2433">steps, stop rules,</text><text x="358.0" y="76.5" text-anchor="middle" font-size="13" fill="#1b2433">escalation text</text><rect x="250" y="110" width="216" height="52" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="358.0" y="131.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Tool: read</text><text x="358.0" y="149.6" text-anchor="middle" font-size="13" fill="#1b2433">logs, metrics only</text><rect x="250" y="176" width="216" height="52" rx="8" fill="#ffe9c7" stroke="#3b4a6b" stroke-width="1.5"/><text x="358.0" y="197.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Tool: act</text><text x="358.0" y="215.6" text-anchor="middle" font-size="13" fill="#1b2433">restart one pod, approval</text><rect x="250" y="242" width="216" height="42" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="358.0" y="258.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Tool: verify</text><text x="358.0" y="276.6" text-anchor="middle" font-size="13" fill="#1b2433">health check</text><line x1="184" y1="60" x2="250" y2="54" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><line x1="184" y1="110" x2="250" y2="136" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><line x1="184" y1="160" x2="250" y2="202" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><line x1="184" y1="210" x2="250" y2="263" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/></svg>
