<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t d" fill="none" font-family="system-ui, sans-serif" color="currentColor">
<title id="t">MCP and A2A shown as vertical and horizontal connections</title>
<desc id="d">Two agents are connected horizontally by A2A. Each agent connects downward to its tools through MCP. A governance layer spans both agents and both kinds of connection.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="340" rx="8" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
<g fill="currentColor">
<rect x="30" y="20" width="160" height="50" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="110.0" y="50.2" text-anchor="middle" font-size="15" font-weight="700">Agent A</text>
<rect x="290" y="20" width="160" height="50" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="370.0" y="50.2" text-anchor="middle" font-size="15" font-weight="700">Agent B</text>
<line x1="190" y1="45" x2="290" y2="45" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<text x="240" y="36" text-anchor="middle" font-size="15" font-weight="700">A2A</text>
<text x="240" y="66" text-anchor="middle" font-size="13">agent to agent</text>
<line x1="110" y1="70" x2="110" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="370" y1="70" x2="370" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
<text x="120" y="108" text-anchor="start" font-size="15" font-weight="700">MCP</text>
<text x="380" y="108" text-anchor="start" font-size="15" font-weight="700">MCP</text>
<rect x="30" y="130" width="160" height="44" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="110.0" y="157.2" text-anchor="middle" font-size="15">Tools and data</text>
<rect x="290" y="130" width="160" height="44" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
<text x="370.0" y="157.2" text-anchor="middle" font-size="15">Tools and data</text>
<rect x="10" y="205" width="460" height="100" rx="6" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="240.0" y="242.2" text-anchor="middle" font-size="15" font-weight="700">Governance layer</text>
<text x="240.0" y="260.2" text-anchor="middle" font-size="15">identity, policy, budgets, audit</text>
<text x="240.0" y="278.2" text-anchor="middle" font-size="15">applies to both connection types</text>
<line x1="110" y1="174" x2="110" y2="205" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="370" y1="174" x2="370" y2="205" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/>
</g>
</svg>
