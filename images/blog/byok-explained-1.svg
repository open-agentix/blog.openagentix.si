<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">BYOK routing through a gateway to multiple model providers</title><desc id="d">The platform sends requests to a gateway, which calls three model providers, each with a customer-owned key and its own spend counter.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b4a6b"/></marker></defs><rect width="480" height="300" rx="12" fill="#f5f7fb"/><rect x="14" y="110" width="100" height="80" rx="8" fill="#dbe7ff" stroke="#3b4a6b" stroke-width="1.5"/><text x="64.0" y="145.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Platform</text><text x="64.0" y="163.6" text-anchor="middle" font-size="13" fill="#1b2433">agents, runs</text><rect x="160" y="110" width="110" height="80" rx="8" fill="#ffe9c7" stroke="#3b4a6b" stroke-width="1.5"/><text x="215.0" y="145.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Gateway</text><text x="215.0" y="163.6" text-anchor="middle" font-size="13" fill="#1b2433">routing, limits</text><line x1="114" y1="150" x2="160" y2="150" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><rect x="320" y="20" width="146" height="64" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="393.0" y="47.5" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Provider A</text><text x="393.0" y="65.5" text-anchor="middle" font-size="13" fill="#1b2433">key A  spend 41</text><line x1="270" y1="150" x2="320" y2="52" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><rect x="320" y="110" width="146" height="64" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="393.0" y="137.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Provider B</text><text x="393.0" y="155.6" text-anchor="middle" font-size="13" fill="#1b2433">key B  spend 17</text><line x1="270" y1="150" x2="320" y2="142" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><rect x="320" y="200" width="146" height="64" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="393.0" y="227.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">Local model</text><text x="393.0" y="245.6" text-anchor="middle" font-size="13" fill="#1b2433">no key  spend 0</text><line x1="270" y1="150" x2="320" y2="232" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><text x="240" y="290" text-anchor="middle" font-size="12" fill="#1b2433">keys and contracts belong to the customer</text></svg>
