<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 208" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif" fill="currentColor">
<title id="t">Insider-risk controls applied to AI agents</title>
<desc id="d">Four controls known from insider-risk programs, mapped to agents: separation of duties, least standing access, monitoring, and approval for irreversible actions.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="208" rx="8" fill="#ffffff"/>
<rect x="10" y="10" width="224" height="88" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><text x="20" y="38" font-size="15" font-weight="700">Separation of duties</text><text x="20" y="62" font-size="13">one agent proposes,</text><text x="20" y="80" font-size="13">another or a person approves</text>
<rect x="246" y="10" width="224" height="88" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><text x="256" y="38" font-size="15" font-weight="700">Least standing access</text><text x="256" y="62" font-size="13">short-lived, scoped</text><text x="256" y="80" font-size="13">credentials per task</text>
<rect x="10" y="110" width="224" height="88" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><text x="20" y="138" font-size="15" font-weight="700">Monitoring</text><text x="20" y="162" font-size="13">tool calls and spend</text><text x="20" y="180" font-size="13">compared with a baseline</text>
<rect x="246" y="110" width="224" height="88" rx="8" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-opacity="0.55"/><text x="256" y="138" font-size="15" font-weight="700">Approval</text><text x="256" y="162" font-size="13">irreversible actions</text><text x="256" y="180" font-size="13">wait for a person</text>
</svg>
