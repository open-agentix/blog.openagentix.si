<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Where AGENTS.md, skills and README sit in a repository</title><desc id="d">Repository tree: AGENTS.md at the root holds project context for agents, a skills folder holds procedures loaded on demand, README.md is written for humans.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b4a6b"/></marker></defs><rect width="480" height="300" rx="12" fill="#f5f7fb"/><rect x="16" y="16" width="200" height="268" rx="8" fill="#ffffff" stroke="#3b4a6b" stroke-width="1.5"/><text x="30" y="44" text-anchor="start" font-size="13" fill="#1b2433" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">my-repo/</text><text x="30" y="70" text-anchor="start" font-size="13" fill="#1b2433" font-family="ui-monospace,Menlo,Consolas,monospace">README.md</text><text x="30" y="100" text-anchor="start" font-size="13" fill="#1b2433" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">AGENTS.md</text><text x="30" y="130" text-anchor="start" font-size="13" fill="#1b2433" font-family="ui-monospace,Menlo,Consolas,monospace">.agents/skills/</text><text x="30" y="160" text-anchor="start" font-size="13" fill="#1b2433" font-family="ui-monospace,Menlo,Consolas,monospace">  release/SKILL.md</text><text x="30" y="190" text-anchor="start" font-size="13" fill="#1b2433" font-family="ui-monospace,Menlo,Consolas,monospace">  migrate-db/SKILL.md</text><text x="30" y="220" text-anchor="start" font-size="13" fill="#1b2433" font-family="ui-monospace,Menlo,Consolas,monospace">src/</text><text x="30" y="250" text-anchor="start" font-size="13" fill="#1b2433" font-family="ui-monospace,Menlo,Consolas,monospace">package.json</text><rect x="250" y="16" width="214" height="70" rx="8" fill="#d9f2e3" stroke="#3b4a6b" stroke-width="1.5"/><text x="357.0" y="46.5" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">README.md</text><text x="357.0" y="64.5" text-anchor="middle" font-size="13" fill="#1b2433">for humans: what and why</text><rect x="250" y="106" width="214" height="80" rx="8" fill="#dbe7ff" stroke="#3b4a6b" stroke-width="1.5"/><text x="357.0" y="132.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">AGENTS.md</text><text x="357.0" y="150.6" text-anchor="middle" font-size="13" fill="#1b2433">always read: build, test,</text><text x="357.0" y="168.6" text-anchor="middle" font-size="13" fill="#1b2433">conventions, limits</text><rect x="250" y="206" width="214" height="78" rx="8" fill="#ffe9c7" stroke="#3b4a6b" stroke-width="1.5"/><text x="357.0" y="231.6" text-anchor="middle" font-size="13" fill="#1b2433" font-weight="700">skills/</text><text x="357.0" y="249.6" text-anchor="middle" font-size="13" fill="#1b2433">on demand: procedures</text><text x="357.0" y="267.6" text-anchor="middle" font-size="13" fill="#1b2433">with scripts and references</text><line x1="216" y1="52" x2="250" y2="52" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><line x1="216" y1="100" x2="250" y2="140" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/><line x1="216" y1="160" x2="250" y2="240" stroke="#3b4a6b" stroke-width="2" marker-end="url(#a)"/></svg>
