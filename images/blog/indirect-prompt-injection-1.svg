<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" fill="currentColor"><title id="t">Indirect prompt injection path stopped at the policy gate</title><desc id="d">An attacker plants text in a ticket. The agent reads it through a tool, the model proposes a harmful action, and the policy gate denies it.</desc><style>svg{color:#1f2937}</style><rect class="oax-bg" x="0" y="0" width="480" height="470" rx="8" fill="#ffffff"/><defs><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ad9534f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9534f"/></marker><marker id="a3a9d6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a9d6e"/></marker><marker id="a4a8fd8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a8fd8"/></marker></defs><rect x="110" y="10" width="260" height="56" rx="6" fill="#d9534f" fill-opacity="0.10" stroke="#d9534f" stroke-width="1.6"/><text x="240.0" y="33.8" text-anchor="middle" font-size="14">1. Attacker plants text</text><text x="240.0" y="52.0" text-anchor="middle" font-size="14">in a ticket or web page</text><line x1="240" y1="66" x2="240" y2="92" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="110" y="92" width="260" height="56" rx="6" fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="1.6"/><text x="240.0" y="115.8" text-anchor="middle" font-size="14">2. Agent reads it</text><text x="240.0" y="134.0" text-anchor="middle" font-size="14">via a tool result</text><line x1="240" y1="148" x2="240" y2="174" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="110" y="174" width="260" height="56" rx="6" fill="#d9534f" fill-opacity="0.10" stroke="#d9534f" stroke-width="1.6"/><text x="240.0" y="197.8" text-anchor="middle" font-size="14">3. Model proposes action</text><text x="240.0" y="216.0" text-anchor="middle" font-size="14">e.g. send data elsewhere</text><line x1="240" y1="230" x2="240" y2="256" stroke="currentColor" stroke-width="1.8" marker-end="url(#ac)"/><rect x="70" y="256" width="340" height="60" rx="6" fill="#4a8fd8" fill-opacity="0.10" stroke="#4a8fd8" stroke-width="1.6"/><text x="240.0" y="281.8" text-anchor="middle" font-size="14" font-weight="700">4. Policy gate checks the call</text><text x="240.0" y="300.0" text-anchor="middle" font-size="14">tool, arguments, identity, budget</text><line x1="240" y1="316" x2="240" y2="342" stroke="#d9534f" stroke-width="1.8" marker-end="url(#ad9534f)"/><rect x="110" y="342" width="260" height="48" rx="6" fill="#d9534f" fill-opacity="0.10" stroke="#d9534f" stroke-width="1.6"/><text x="240.0" y="370.9" text-anchor="middle" font-size="14" font-weight="700">Denied and logged</text><text x="240" y="426.1" text-anchor="middle" font-size="13">Blast radius is limited by design,</text><text x="240" y="443.0" text-anchor="middle" font-size="13">not by hoping the model ignores the text</text></svg>
