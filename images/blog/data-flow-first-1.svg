<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" role="img" aria-labelledby="t d"><title id="t">Data flow template with trust boundaries for an agent design</title><desc id="d">A data flow template with trusted and untrusted sources on the left, an agent in the middle, a private data store below and egress points on the right. Dashed lines mark trust boundaries.</desc><style>text{fill:currentColor;font:14px sans-serif}.h{font-weight:600}.b{fill:none;stroke:currentColor;stroke-width:1.5;stroke-opacity:.75}.f{fill:currentColor;fill-opacity:.07}.a{stroke:var(--accent,#6d28d9);stroke-opacity:1;stroke-width:2}.at{fill:var(--accent,#6d28d9)}.r{stroke:var(--danger,#be123c);stroke-width:2}.rt{fill:var(--danger,#be123c)}.d{stroke-dasharray:6 4}.l{stroke:currentColor;stroke-width:1.5;stroke-opacity:.75;fill:none}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><rect x="10" y="30" width="130" height="50" rx="6" class="b f r"/><text x="75.0" y="52.0" text-anchor="middle" class="h rt">Untrusted input</text><text x="75.0" y="70.0" text-anchor="middle" class="rt">web, mail, tickets</text><rect x="10" y="100" width="130" height="50" rx="6" class="b f"/><text x="75.0" y="122.0" text-anchor="middle" class="h ">Trusted input</text><text x="75.0" y="140.0" text-anchor="middle" class="">user, config</text><rect x="190" y="60" width="110" height="60" rx="6" class="b f a"/><text x="245.0" y="87.0" text-anchor="middle" class="h at">Agent</text><text x="245.0" y="105.0" text-anchor="middle" class="at">model + tools</text><rect x="10" y="190" width="130" height="50" rx="6" class="b f"/><text x="75.0" y="212.0" text-anchor="middle" class="h ">Private store</text><text x="75.0" y="230.0" text-anchor="middle" class="">CRM, files</text><rect x="350" y="60" width="120" height="50" rx="6" class="b f r"/><text x="410.0" y="82.0" text-anchor="middle" class="h rt">Egress</text><text x="410.0" y="100.0" text-anchor="middle" class="rt">mail, HTTP, git push</text><line x1="140" y1="55" x2="188" y2="80" class="l" marker-end="url(#m)"/><line x1="140" y1="125" x2="188" y2="100" class="l" marker-end="url(#m)"/><line x1="75" y1="190" x2="205" y2="122" class="l" marker-end="url(#m)"/><line x1="300" y1="90" x2="348" y2="85" class="l" marker-end="url(#m)"/><line x1="165" y1="20" x2="165" y2="250" class="l d"/><line x1="325" y1="20" x2="325" y2="250" class="l d"/><text x="240" y="276" text-anchor="middle" class="">Dashed lines: trust boundaries.</text><text x="240" y="296" text-anchor="middle" class="rt">Untrusted in + private data + egress out = lethal trifecta.</text></svg>
