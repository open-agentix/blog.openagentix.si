<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 305" role="img" aria-labelledby="t d"><title id="t">Semantic versioning applied to an agent skill</title><desc id="d">A timeline of a skill from version 1.0.0 to 1.1.0 to 2.0.0, with examples of a patch change (wording), a minor change (new optional step) and a breaking major change (new required input or changed output).</desc><style>text{fill:currentColor;font:14px sans-serif}.h{font-weight:600}.b{fill:none;stroke:currentColor;stroke-width:1.5;stroke-opacity:.75}.f{fill:currentColor;fill-opacity:.07}.a{stroke:var(--accent,#6d28d9);stroke-opacity:1;stroke-width:2}.at{fill:var(--accent,#6d28d9)}.r{stroke:var(--danger,#be123c);stroke-width:2}.rt{fill:var(--danger,#be123c)}.d{stroke-dasharray:6 4}.l{stroke:currentColor;stroke-width:1.5;stroke-opacity:.75;fill:none}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><line x1="30" y1="90" x2="450" y2="90" class="l"/><circle cx="60" cy="90" r="9" class="b f "/><text x="60" y="70" text-anchor="middle" class="h">1.0.0</text><circle cx="240" cy="90" r="9" class="b f "/><text x="240" y="70" text-anchor="middle" class="h">1.1.0</text><circle cx="420" cy="90" r="9" class="b f a"/><text x="420" y="70" text-anchor="middle" class="h">2.0.0</text><text x="150" y="120" text-anchor="middle" class="">minor</text><text x="330" y="120" text-anchor="middle" class="rt">major</text><text x="10" y="160" text-anchor="start" class="">Patch (1.0.x): typo, clearer wording,</text><text x="10" y="180" text-anchor="start" class="">same behaviour, evals unchanged.</text><text x="10" y="214" text-anchor="start" class="">Minor (1.1.0): new optional step or example,</text><text x="10" y="234" text-anchor="start" class="">old tasks still pass.</text><text x="10" y="268" text-anchor="start" class="rt">Major (2.0.0): new required input, removed tool,</text><text x="10" y="288" text-anchor="start" class="rt">changed output format. Evals must be re-baselined.</text></svg>
